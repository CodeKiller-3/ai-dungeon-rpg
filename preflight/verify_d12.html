<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="preflight-meta" content="1">
<title>verify_d12</title>
<style>body{background:#0b0b14;color:#ddd;font:12px monospace;margin:0}</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="npc"><div id="npc-title"></div><div id="npc-log"></div><input id="npc-input"></div>
<!-- D-12 验收页：流畅度/跟手度优化。
     a) 读 d12-before.json / d12-after.json 的同一压测数字并断言改善
     b) 静态层离屏缓存 vs 直绘 的逐像素比对（摘掉光影应 0 差异；带光影仅暗角二次合成舍入）
     c) 输入语义：一次按键一格 / 按住连发 / 节流窗口内按下不丢 / AI 节奏不变
     d) 换层 / DPR-resize 后缓存重建，且与直绘逐像素一致（无旧楼层残影） -->
<script src="lib/meta.js"></script>
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>
<script src="../js/core/eventBus.js"></script>
<script src="../js/core/sprites.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/render.js"></script>
<script src="../js/data/maps.js"></script>
<script src="../js/data/monsters.js"></script>
<script src="../js/data/items.js"></script>
<script src="../js/data/quests.js"></script>
<script src="../js/data/skills.js"></script>
<script src="../js/data/dialogue.js"></script>
<script src="../js/data/reactions.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/vendor/astar.js"></script>
<script src="../js/vendor/howler.min.js"></script>
<script src="../js/vendor/rot.min.js"></script>
<script src="../js/systems/map.js"></script>
<script src="../js/systems/fov.js"></script>
<script src="../js/systems/hud.js"></script>
<script src="../js/systems/modal.js"></script>
<script src="../js/systems/feedback.js"></script>
<script src="../js/systems/lighting.js"></script>
<script src="../js/systems/motion.js"></script>
<script src="../js/systems/particles.js"></script>
<script src="../js/systems/quest.js"></script>
<script src="../js/systems/skills.js"></script>
<script src="../js/systems/bestiary.js"></script>
<script src="../js/systems/battle.js"></script>
<script src="../js/systems/inventory.js"></script>
<script src="../js/systems/shop.js"></script>
<script src="../js/systems/save.js"></script>
<script src="../js/systems/leaderboard.js"></script>
<script src="../js/systems/ai.js"></script>
<script src="../js/systems/npc.js"></script>
<script src="../js/systems/audio.js"></script>
<script src="../js/systems/learner.js"></script>
<script src="../js/core/main.js"></script>
<script>
(function () {
  'use strict';
  var G = window.Game, M = G.Core.Main, P = G.Data.Player, R = G.Core.Render;
  var out = { page: 'd12', loaded: false };
  var clock = 0, DT = 1000 / 60;

  function readDoc(rel) {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', new URL(rel, location.href).href, false);
      x.send(null);
      return (x.responseText || '');
    } catch (e) { return ''; }
  }
  function readJson(rel) {
    try { return JSON.parse(readDoc(rel).replace(/^\uFEFF/, '')); } catch (e) { return null; }
  }
  function emit(ok, obj) {
    var text = (ok ? 'PASS ' : 'FAIL ') + JSON.stringify(obj);
    document.title = text;
    document.body.appendChild(document.createTextNode(text));
  }
  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ── 帧驱动（合成时钟，和游戏内部节流同一时间轴） ── */
  function frame(n) {
    for (var i = 0; i < (n || 1); i++) { clock += DT; M.loop(clock); }
  }
  function press(c) { window.dispatchEvent(new KeyboardEvent('keydown', { code: c, bubbles: true })); }
  function release(c) { window.dispatchEvent(new KeyboardEvent('keyup', { code: c, bubbles: true })); }
  function idle() { G.Core.Input.clear(); }

  function walkable(x, y) {
    if (!G.Systems.Map.isWalkable(x, y)) return false;
    var t = G.Systems.Map.tileAt(x, y);
    return t !== 2 && t !== 3;
  }
  /* 找当前层最长的一条直走通道（地板格，装饰不挡路所以不计入） */
  function bestRun() {
    var grid = G.Systems.Map.getGrid();
    var dirs = [['ArrowRight', 1, 0], ['ArrowLeft', -1, 0], ['ArrowDown', 0, 1], ['ArrowUp', 0, -1]];
    var best = null;
    for (var y = 1; y < grid.length - 1; y++) {
      for (var x = 1; x < grid[0].length - 1; x++) {
        if (!walkable(x, y)) continue;
        for (var k = 0; k < dirs.length; k++) {
          var d = dirs[k], n = 0;
          while (walkable(x + d[1] * n, y + d[2] * n)) n++;
          if (!best || n > best.len) {
            best = { x: x, y: y, code: d[0], dx: d[1], dy: d[2], len: n };
          }
        }
      }
    }
    return best;
  }
  function findRun(len) {
    var b = bestRun();
    return (b && b.len >= len) ? b : null;
  }
  function teleport(r) {
    idle();
    P.x = r.x; P.y = r.y; P.floor = G.Systems.Map.getFloor();
    G.fov.update(P.x, P.y, G.fov.RADIUS || 5, function (x, y) {
      return G.Systems.Map.tileAt(x, y) === 0;
    });
    R.invalidateStatic();
    if (G.Motion && G.Motion.clear) G.Motion.clear();
  }
  function steps(n) {
    var lx = P.x, ly = P.y, c = 0;
    for (var i = 0; i < n; i++) {
      clock += DT; M.loop(clock);
      if (P.x !== lx || P.y !== ly) { c++; lx = P.x; ly = P.y; }
    }
    return c;
  }

  /* ── 像素比对 ── */
  function capture() {
    return R._ctx.getImageData(0, 0, R._canvas.width, R._canvas.height).data;
  }
  function diff(a, b) {
    var n = 0, max = 0, step = 1;
    for (var i = 0; i < a.length; i += 4) {
      var d0 = Math.abs(a[i] - b[i]);
      var d1 = Math.abs(a[i + 1] - b[i + 1]);
      var d2 = Math.abs(a[i + 2] - b[i + 2]);
      var d3 = Math.abs(a[i + 3] - b[i + 3]);
      var m = Math.max(d0, d1, d2, d3);
      if (m > 0) n++;
      if (m > max) max = m;
    }
    return { diffPixels: n, ratio: Math.round(n / (a.length / 4) * 10000) / 10000, maxDelta: max };
  }
  function fnv(data) {
    var h = 0x811c9dc5;
    for (var i = 0; i < data.length; i++) { h ^= data[i]; h = Math.imul(h, 0x01000193) >>> 0; }
    return ('00000000' + h.toString(16)).slice(-8);
  }

  /* ── 启动 ── */
  function boot() {
    Math.random = mulberry32(20261210);
    var load = G.Core.Sprites.load;
    G.Core.Sprites.load = function () { return load.call(this, '../assets/sprites/'); };
    M.init();
    window.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    M._guideVisible = false;
    try { G.Systems.Map.getEnemies().length = 0; } catch (e) { /* 忽略 */ }
    try { G.Systems.AI.setPatrols([]); } catch (e) { /* 忽略 */ }
    P.hp = 100000; P.maxHp = 100000;
    R._animNow = function () { return 5000; }; /* 冻结动画帧，保证两次捕获同帧 */
  }
  function spritesReady() {
    return !!(G.Core.Sprites.isReady() && G.Core.Sprites.get('floor_1') &&
      G.Core.Sprites.get('wall_top_mid') && G.Core.Sprites.get('knight_m_idle_anim_f0'));
  }

  function runA() {
    var before = readJson('selfcheck/d12-before.json');
    var after = readJson('selfcheck/d12-after.json');
    out.loaded = !!(before && after && before.result && after.result);
    if (!out.loaded) return { ok: false, reason: '缺少 d12-before/after.json' };
    var b = before.result, a = after.result;
    var bs = b.staticBig, as = a.staticBig, bl = b.latency, al = a.latency;
    var rec = {
      before_frame_p50: bs.frame.p50, after_frame_p50: as.frame.p50,
      before_frame_p95: bs.frame.p95, after_frame_p95: as.frame.p95,
      before_drawImage: bs.drawImage.p50, after_drawImage: as.drawImage.p50,
      before_spriteGet: bs.spriteGet.p50 + bs.spriteGetFrame.p50,
      after_spriteGet: as.spriteGet.p50 + as.spriteGetFrame.p50,
      before_tapDrop: bl.tapDrop, after_tapDrop: al.tapDrop,
      before_latency_p50: bl.all.p50, after_latency_p50: al.all.p50,
      before_latency_p95: bl.all.p95, after_latency_p95: al.all.p95,
      before_latency_max: bl.all.max, after_latency_max: al.all.max
    };
    var ok = rec.after_frame_p50 <= rec.before_frame_p50 * 0.5 &&
      rec.after_drawImage <= 20 && rec.before_drawImage >= 800 &&
      rec.after_spriteGet <= 20 && rec.before_spriteGet >= 800 &&
      rec.after_tapDrop === 0 && rec.after_latency_p95 < 20 &&
      rec.after_latency_max < 20;
    rec.pass = ok;
    emit(ok, Object.assign({ id: 'd12_a' }, rec));
    return { ok: ok, rec: rec };
  }

  function runB() {
    /* 隐藏动态层，只留静态场景；对比"直绘(_staticBypass)"与"离屏缓存 blit" */
    var o = {
      player: R.drawPlayer, hud: R.drawHUD, hudDraw: G.hud.draw,
      particles: G.Particles.draw, light: G.Lighting.draw
    };
    function hide(hideLight) {
      R.drawPlayer = function () { }; R.drawHUD = function () { };
      G.hud.draw = function () { }; G.Particles.draw = function () { };
      G.Lighting.draw = hideLight ? function () { } : o.light;
    }
    function restore() {
      R.drawPlayer = o.player; R.drawHUD = o.hud; G.hud.draw = o.hudDraw;
      G.Particles.draw = o.particles; G.Lighting.draw = o.light; R._staticBypass = false;
    }
    function shot(bypass) {
      R._staticBypass = bypass;
      if (!bypass) R.invalidateStatic();
      idle();
      frame(1);
      return capture();
    }
    var rec = {};
    hide(true);
    var direct1 = shot(true);
    var cached1 = shot(false);
    rec.noLight = diff(direct1, cached1);
    rec.noLightExact = rec.noLight.diffPixels === 0;
    var h1 = fnv(direct1);

    hide(false);
    var direct2 = shot(true);
    var cached2 = shot(false);
    rec.withLight = diff(direct2, cached2);
    rec.withLightOk = rec.withLight.maxDelta <= 1;
    rec.frameHashDirect = h1;
    restore();

    var ok = rec.noLightExact && rec.withLightOk;
    rec.pass = ok;
    emit(ok, Object.assign({ id: 'd12_b' }, rec));
    return { ok: ok, rec: rec };
  }

  function runC() {
    var rec = { tap: [], hold: 0, phases: [], aiHold: 0, aiMash: 0 };
    var run20 = bestRun();
    rec.bestLen = run20 ? run20.len : 0;
    var ok = !!run20 && run20.len >= 12;
    if (!ok) { rec.reason = '找不到够长的直走通道（>=12 格）'; emit(false, Object.assign({ id: 'd12_c' }, rec)); return { ok: false }; }

    /* c1 一次按键只走一格：短按（2 帧）20 次，每次必须恰好 1 格 */
    for (var i = 0; i < 20 && ok; i++) {
      teleport(run20);
      idle(); frame(2);
      press(run20.code);
      var n = steps(2);
      release(run20.code);
      n += steps(14);
      rec.tap.push(n);
      if (n !== 1) ok = false;
    }

    /* c2 按住连发：按住 1000ms，必须是多格、且受 120ms 节拍约束（8~10 格） */
    teleport(run20);
    idle(); frame(2);
    press(run20.code);
    rec.hold = steps(60);
    release(run20.code);
    steps(8);
    if (!(rec.hold >= 8 && rec.hold <= 10)) ok = false;

    /* c3 节流窗口内按下不再丢：在一步之后 0~11 帧的每个相位各按一次，都必须恰好 1 格 */
    for (var p = 0; p < 12 && ok; p++) {
      teleport(run20);
      idle(); frame(2);
      press(run20.code); steps(1); release(run20.code); /* 制造一次步，作为节流起点 */
      steps(p);
      var x0 = P.x, y0 = P.y;
      press(run20.code);
      var got = steps(2);
      release(run20.code);
      got += steps(10);
      rec.phases.push(got);
      /* 可能因地图/位移起点不同被判为撞墙：只在"有位移"时断言恰好 1 格 */
      if (got > 1) ok = false;
      if (got === 0 && (P.x !== x0 || P.y !== y0)) ok = false;
    }

    /* c4 AI 节奏不随按键频率变化：按住 60 帧 vs 每 2 帧点按，AI tick 次数应同量级 */
    var ticks = 0, rawTick = G.Systems.AI.tick;
    G.Systems.AI.tick = function () { ticks++; return rawTick.apply(this, arguments); };
    teleport(run20); idle(); frame(2);
    ticks = 0; press(run20.code); steps(60); release(run20.code);
    rec.aiHold = ticks;
    teleport(run20); idle(); frame(2);
    ticks = 0;
    for (var m = 0; m < 30; m++) { press(run20.code); steps(2); release(run20.code); steps(0); }
    rec.aiMash = ticks;
    G.Systems.AI.tick = rawTick;
    if (Math.abs(rec.aiHold - rec.aiMash) > 1) ok = false;
    if (rec.aiHold < 6 || rec.aiMash < 6) ok = false;

    rec.pass = ok;
    emit(ok, Object.assign({ id: 'd12_c' }, rec));
    return { ok: ok, rec: rec };
  }

  function runD() {
    var rec = {};
    var o = { player: R.drawPlayer, hud: R.drawHUD, hudDraw: G.hud.draw, particles: G.Particles.draw, light: G.Lighting.draw };
    function hide() {
      R.drawPlayer = function () { }; R.drawHUD = function () { };
      G.hud.draw = function () { }; G.Particles.draw = function () { };
      G.Lighting.draw = function () { };
    }
    function restore() {
      R.drawPlayer = o.player; R.drawHUD = o.hud; G.hud.draw = o.hudDraw;
      G.Particles.draw = o.particles; G.Lighting.draw = o.light; R._staticBypass = false;
    }
    function shot(bypass) {
      R._staticBypass = bypass;
      if (!bypass) R.invalidateStatic();
      idle();
      frame(1);
      return capture();
    }
    hide();

    var run = findRun(4);
    if (run) teleport(run);

    /* d1 缓存命中后不再逐帧重建 */
    R.invalidateStatic(); frame(1);
    var b0 = R._staticRebuilds || 0;
    frame(5);
    rec.rebuildsIn5IdleFrames = (R._staticRebuilds || 0) - b0;

    /* d2 走一步 → 恰好重建 1 次 */
    var b1 = R._staticRebuilds || 0;
    if (run) { press(run.code); steps(1); release(run.code); steps(1); }
    rec.rebuildsAfterStep = (R._staticRebuilds || 0) - b1;

    /* d3 换层后：缓存重建结果必须与直绘逐像素一致（无旧层残影），且画面确实变了 */
    var h1 = fnv(shot(false));
    G.Systems.Map.setFloor(3);
    var sp = G.Systems.Map.getSpawn();
    P.x = sp.x; P.y = sp.y; P.floor = 3;
    G.fov.update(P.x, P.y, G.fov.RADIUS || 5, function (x, y) {
      return G.Systems.Map.tileAt(x, y) === 0;
    });
    R.invalidateStatic();
    var directF3 = shot(true);
    var cachedF3 = shot(false);
    rec.floorChanged = diff(directF3, cachedF3);
    rec.floorChangedOk = rec.floorChanged.diffPixels === 0;
    rec.floorHashChanged = fnv(cachedF3) !== h1;

    /* d4 DPR/尺寸变化后同样必须重建并与直绘一致 */
    R.resize(2);
    var directDpr = shot(true);
    var cachedDpr = shot(false);
    rec.resized = diff(directDpr, cachedDpr);
    rec.resizedOk = rec.resized.diffPixels === 0;
    R.resize(1);
    restore();

    var ok = rec.rebuildsIn5IdleFrames === 0 && rec.rebuildsAfterStep === 1 &&
      rec.floorChangedOk && rec.floorHashChanged && rec.resizedOk;
    rec.pass = ok;
    emit(ok, Object.assign({ id: 'd12_d' }, rec));
    return { ok: ok, rec: rec };
  }

  /* ── 执行 ── */
  boot();
  var waited = 0;
  (function waitSprites() {
    if (spritesReady()) {
      try {
        var a = runA(), b = runB(), c = runC(), d = runD();
        var ok = !!(a.ok && b.ok && c.ok && d.ok);
        emit(ok, {
          page: 'd12',
          items: 4,
          a: ok ? 'perf' : 'perf-fail',
          b: 'pixel-equivalence',
          c: 'input-semantics',
          d: 'cache-rebuild',
          pass: ok
        });
      } catch (e) {
        emit(false, { page: 'd12', error: String((e && e.stack) || e) });
      }
      return;
    }
    waited += 100;
    if (waited > 20000) { emit(false, { page: 'd12', error: 'sprites not ready' }); return; }
    setTimeout(waitSprites, 100);
  })();
})();
</script>
</body>
</html>
