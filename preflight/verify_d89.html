<body>
<h1>D-89：接触位移 / 落地与接触阴影 / 亮度全层复核 / 龙体量</h1>
<pre id="result">RUNNING</pre>
<canvas id="game"></canvas>
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>
<script src="../js/core/eventBus.js"></script>

<script>
(function () {
  'use strict';
  Game.Core.Render._setBattleLayout('vertical');  /* D-94 P7：本页判竖置几何，不靠默认值 */
  var out = { protocol: 'D-89', ok: true, sub: {} };
  function rec(name, ok, d) { out.sub[name] = { ok: !!ok, d: d }; if (!ok) out.ok = false; }
  function lum(r, g, b) { return Math.round(r * 0.299 + g * 0.587 + b * 0.114); }
  function r2(v) { return Math.round(v * 100) / 100; }

  try {
    Object.defineProperty(window, 'innerWidth', { value: 1024, configurable: true });
    Object.defineProperty(window, 'innerHeight', { value: 640, configurable: true });
  } catch (e) {}

  var cv = document.getElementById('game');
  var R = Game.Core.Render, S = Game.Core.Sprites, M = Game.Core.Main;
  var B = Game.Systems.Battle, Fx = Game.Fx, PT = Game.Particles, P = Game.Data.Player;
  var MAPS = Game.Data.MAPS;
  var W = 1024, H = 640, c = null, T = 0;

  var spriteLoad = S.load;
  S.load = function () { return spriteLoad.call(this, '../assets/sprites/'); };

  function px(x, y) { return c.getImageData(x, y, 1, 1).data; }
  function lumAt(x, y) { var d = px(x, y); return lum(d[0], d[1], d[2]); }
  function maxLumRect(x0, y0, x1, y1) {
    var mx = -1, at = null;
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) {
      var l = lumAt(x, y); if (l > mx) { mx = l; at = { x: x, y: y }; }
    }
    return { max: mx, at: at };
  }
  function meanLumRect(x0, y0, x1, y1) {
    var s = 0, n = 0;
    for (var y = y0; y < y1; y++) for (var x = x0; x < x1; x++) { s += lumAt(x, y); n++; }
    return Math.round(s / n);
  }
  /* 同尺寸区域逐像素差（血条保护：斩击出现前后血条矩形必须逐像素一致） */
  function rectData(x, y, w, h) { return c.getImageData(x, y, w, h).data; }
  function diffRect(a, b) {
    var n = 0, mx = 0;
    for (var i = 0; i < a.length; i += 4) {
      var d = Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
      if (d > 12) n++;
      if (d > mx) mx = d;
    }
    return { n: n, max: mx };
  }

  /* 精灵亮度统计（按原生像素，最近邻放大不改变亮度） */
  function spriteStats(id) {
    var anim = R.MONSTER_ANIM[id];
    if (!anim) return null;
    var img = S.getFrame(anim.idle, 0);
    return img ? statsOf(img) : null;
  }
  var tcv = null;
  function statsOf(img) {
    if (!tcv) { tcv = document.createElement('canvas'); }
    var g = tcv.getContext('2d');
    tcv.width = img.naturalWidth; tcv.height = img.naturalHeight;
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, tcv.width, tcv.height);
    g.drawImage(img, 0, 0);
    var d = g.getImageData(0, 0, tcv.width, tcv.height).data;
    var ls = [];
    for (var i = 0; i < d.length; i += 4) if (d[i + 3] > 200) ls.push(lum(d[i], d[i + 1], d[i + 2]));
    ls.sort(function (a, b) { return a - b; });
    var mean = 0; for (var k = 0; k < ls.length; k++) mean += ls[k];
    return {
      w: tcv.width, h: tcv.height, n: ls.length,
      mean: Math.round(mean / Math.max(1, ls.length)),
      p90: ls[Math.floor(ls.length * 0.90)],
      max: ls[ls.length - 1]
    };
  }

  function setupBattle(floor, mid) {
    Fx._reset();
    PT.clear();
    T = 0;
    B._setClock(function () { return T; });
    Fx._setClock(function () { return T; });
    P.floor = floor; P.level = 5; P.exp = 24; P.gold = 268;
    P.hp = 100; P.maxHp = 140; P.mp = 30; P.maxMp = 30;
    P.atk = 14; P.def = 6;
    Game.Systems.Map.setFloor(floor);
    B.start(mid);
    M.switchScene('battle');
    R.resize();
    if (Game.hud && Game.hud.update) {
      Game.hud.update({
        hp: P.hp, hpMax: P.maxHp, mp: P.mp, mpMax: P.maxMp, gold: P.gold,
        floor: P.floor, level: P.level, exp: P.exp, expNext: 60 * P.level, status: []
      });
    }
  }
  function draw() { R.drawBattle(B.getState()); return R._lastBattleBox; }

  function boot() {
    try {
      M.init({ menu: false });
      R._animNow = function () { return 1234; };
      R.resize();
      c = cv.getContext('2d');
      c.imageSmoothingEnabled = false;

      /* ══ E：身体位移（逐帧坐标 + 战斗时钟不变）════════════ */
      setupBattle(2, 'orc_warrior');
      T = 0;
      B.playerAction('attack');
      var hitT = [0, 25, 50, 60, 75, 90, 100];
      var hitFrames = hitT.map(function (t) {
        T = t;
        var b = draw();
        return { t: t, top: b.monster.y, base: b.monster.baseTop, off: b.monster.baseTop - b.monster.y };
      });
      T = 100;
      B.tick(100);
      var cntT = [0, 25, 50, 60, 75, 90, 100];
      var cntFrames = cntT.map(function (dt) {
        T = 100 + dt;
        var b = draw();
        return { dt: dt, t: 100 + dt, top: b.player.y, base: b.player.baseTop, off: b.player.y - b.player.baseTop };
      });
      var hitOk = hitFrames[0].off === 4 && hitFrames[1].off === 4 && hitFrames[2].off === 4 &&
        hitFrames[3].off < 4 && hitFrames[3].off >= 2 && hitFrames[4].off <= 1 && hitFrames[5].off === 0 && hitFrames[6].off === 0;
      var cntOk = cntFrames[0].off === 7 && cntFrames[1].off === 7 && cntFrames[2].off === 7 &&
        cntFrames[3].off >= 5 && cntFrames[3].off <= 7 && cntFrames[4].off >= 2 && cntFrames[4].off <= 5 &&
        cntFrames[5].off >= 0 && cntFrames[5].off <= 2 && cntFrames[6].off === 0;
      rec('E1_bodyDisplacement', hitOk && cntOk, {
        rule: '怪物被命中：逐帧顶起 4px 并保持 50ms，80ms 归零；玩家被反击：逐帧压下 7px 并保持 50ms，100ms 归零',
        monster: hitFrames, player: cntFrames
      });

      var tl = B.getTimeline();
      var planOk = tl && tl.plan.seg1 === 100 && tl.plan.lock === 150 && tl.plan.total === 180;
      rec('E2_battleClock', !!planOk, { rule: '100/150/180 一律不动', plan: tl && tl.plan });

      /* ══ E3：横置同基线——几何只从 Render._battleLayoutGeo 取，不复制常量 ══════
       * 同一份 setupBattle / draw()，只切布局；比对的是"双方脚底 = 共享地平线"这件事。 */
      R._setBattleLayout('horizontal');
      setupBattle(2, 'orc_warrior');
      T = 0;
      var hb = draw();
      var hg = R._battleLayoutGeo(W, H);
      var hLayout = R._battleLayoutNow();
      var hFeet = hb.player && hb.monster &&
        (hb.player.y + hb.player.h) === hg.groundY && (hb.monster.y + hb.monster.h) === hg.groundY &&
        hb.player.groundY === hg.groundY && hb.monster.groundY === hg.groundY;
      var hPlates = hb.playerPlate && hb.monsterPlate &&
        hb.playerPlate.y + hb.playerPlate.h <= Math.min(hb.player.y, hb.monster.y) &&
        hb.monsterPlate.y + hb.monsterPlate.h <= Math.min(hb.player.y, hb.monster.y);
      var hBar = hb.commandBar && hb.commandBar.y >= hg.groundY;
      rec('E3_horizontalSharedGeo', hLayout === 'horizontal' && !!hg && !!hFeet && !!hPlates && !!hBar, {
        rule: '横置：玩家/怪物脚底都落在 _battleLayoutGeo(共享几何) 的 groundY 上；铭牌在双方精灵顶之上；指令条在地平线之下',
        layout: hLayout, g: hg, player: hb.player, monster: hb.monster,
        plates: [hb.playerPlate, hb.monsterPlate], commandBarY: hb.commandBar && hb.commandBar.y
      });
      R._setBattleLayout('vertical');

      /* ══ F：接触点火花 + 血条保护 ═══════════════════════ */
      setupBattle(2, 'orc_warrior');
      T = 0;
      B.playerAction('attack');
      var box0 = draw();
      var ctM = B._contact('monster');
      var pList = PT._list();
      var impacts = pList.filter(function (p) { return p.kind === 'impact' || p.kind === 'spark'; });
      var allAtContact = impacts.length >= 16 && impacts.every(function (p) {
        return Math.abs(p.x - ctM.x) < 0.01 && Math.abs(p.y - ctM.y) < 0.01;
      });
      var inBody = ctM.x > box0.monster.x + box0.monster.w * 0.55 &&
        ctM.x < box0.monster.x + box0.monster.w &&
        ctM.y > box0.monster.y + box0.monster.h * 0.72 &&
        ctM.y < box0.monster.y + box0.monster.h;
      var st0 = Fx._state();
      var ringOk = st0.ringPos && Math.abs(st0.ringPos.x - ctM.x) < 0.01 && Math.abs(st0.ringPos.y - ctM.y) < 0.01;
      rec('F1_contactSpark', allAtContact && inBody && ringOk, {
        rule: 'impact/spark 的出生点、冲击环圆心、斩击中心三者都等于接触点，且接触点位于怪物身体下缘（剑锋与身体交界）',
        contact: ctM, sparks: impacts.length, allAtContact: allAtContact, inBody: inBody, ring: st0.ringPos,
        monsterBox: box0.monster
      });

      /* 血条保护：同一战斗状态、同一时刻，斩击存在 vs 斩击清空，两条血条矩形逐像素一致 */
      Fx._reset(); PT.clear();
      T = 0;
      B.playerAction('attack');
      T = 0;
      draw();
      var ebA = rectData(W / 2 - 172, 210, 344, 26);
      var pbA = rectData(W / 2 - 172, 412, 344, 26);
      Fx._reset(); PT.clear();
      T = 0;
      draw();
      var ebB = rectData(W / 2 - 172, 210, 344, 26);
      var pbB = rectData(W / 2 - 172, 412, 344, 26);
      var dEb = diffRect(ebA, ebB), dPb = diffRect(pbA, pbB);
      /* 反击侧同样检查（玩家弧） */
      Fx._reset(); PT.clear();
      T = 0; B.playerAction('attack'); T = 100; B.tick(100);
      draw();
      var cbA = rectData(W / 2 - 172, 412, 344, 26);
      Fx._reset(); PT.clear();
      T = 100;
      draw();
      var cbB = rectData(W / 2 - 172, 412, 344, 26);
      var dCb = diffRect(cbA, cbB);
      rec('F2_hpBarSafe', dEb.n === 0 && dPb.n === 0 && dCb.n === 0, {
        rule: '斩击弧不得覆盖任何 HP 读数：敌/我血条矩形（344×26）在斩击出现前后逐像素一致（差>12 视为覆盖）',
        enemyBar: dEb, playerBarHit: dPb, playerBarCounter: dCb
      });

      /* ══ G：接触阴影（五层）+ 构件落地 ═══════════════════ */
      var shadowRows = [];
      var shadowBad = [];
      var floorEnemy = ['slime', 'orc_warrior', 'wogol', 'necromancer', 'dragon'];
      for (var sf = 1; sf <= 5; sf++) {
        setupBattle(sf, floorEnemy[sf - 1]);
        T = 0;
        var bb = draw();
        var mid = { x: bb.monster.x + bb.monster.w / 2, w: bb.monster.w, gy: bb.monster.groundY };
        var pid = { x: bb.player.x + bb.player.w / 2, w: bb.player.w, gy: bb.player.groundY };
        function sample(o) {
          var rx = Math.round(o.w * 0.58);
          var core = lumAt(Math.round(o.x + o.w / 2 + 3), o.gy - 1);
          var ring = lumAt(Math.round(o.x + rx + 2), o.gy);
          var ref = lumAt(Math.round(o.x + rx * 1.22 + 12), o.gy);
          return { core: core, ring: ring, ref: ref, rx: rx };
        }
        var sm = sample(mid), sp = sample(pid);
        var okM = sm.core <= sm.ring - 6 && sm.ring >= sm.ref + 2;
        var okP = sp.core <= sp.ring - 6 && sp.ring >= sp.ref + 2;
        shadowRows.push({ f: sf, monster: sm, player: sp, ok: okM && okP });
        if (!(okM && okP)) shadowBad.push({ f: sf, m: sm, p: sp });
      }
      rec('G1_contactShadow', shadowBad.length === 0, {
        rule: '五层：怪物与玩家脚下都有"暗核 + 环境亮边"；暗核比亮边暗 ≥6，亮边比圈外亮 ≥2',
        bad: shadowBad, rows: shadowRows
      });

      var propRows = [];
      var propBad = [];
      /* F1 / F5：立地火把杆必须从焰座连续落到 424 以上（地面 432） */
      for (var pf = 1; pf <= 5; pf++) {
        if (pf !== 1 && pf !== 5) continue;
        setupBattle(pf, pf === 1 ? 'slime' : 'dragon');
        draw();
        var tx = Math.round(W * 0.16);
        var mn = 255;
        for (var yy = 360; yy <= 424; yy++) mn = Math.min(mn, lumAt(tx, yy));
        var base = lumAt(tx, 428);
        var ok = mn >= 14 && base >= 18;
        propRows.push({ f: pf, poleMin: mn, base: base, ok: ok });
        if (!ok) propBad.push({ f: pf, poleMin: mn, base: base });
      }
      /* F2：篝火必须落到地面（旧版悬在 372）；旧悬空区不许有亮像素；地面有接触暗面 */
      setupBattle(2, 'orc_warrior');
      draw();
      var oldZone = maxLumRect(130, 330, 205, 405);
      var fireBright = maxLumRect(120, 400, 210, 500);
      var fireBottom = -1;
      for (var fy2 = 400; fy2 <= 500; fy2++) {
        if (lumAt(169, fy2) >= 120) fireBottom = fy2;
      }
      var fireCore = lumAt(188, 486), fireRef = lumAt(234, 486);
      var crateLow = -1;
      var cbx = W - Math.max(78, W * 0.09);
      var ccol = Math.round(cbx + 40);
      for (var cy2 = 350; cy2 <= 440; cy2++) {
        var d2 = px(ccol, cy2);
        if (Math.abs(d2[0] - 42) <= 6 && Math.abs(d2[1] - 32) <= 6 && Math.abs(d2[2] - 20) <= 6) { crateLow = cy2; }
      }
      var f2ok = oldZone.max <= 120 && fireBottom >= 400 && fireBright.at &&
        fireCore <= fireRef - 6 && crateLow >= 426 && crateLow <= 434;
      propRows.push({ f: 2, oldZoneMax: oldZone.max, fireBottom: fireBottom, fireBright: fireBright.at, fireCore: fireCore, fireRef: fireRef, crateBottom: crateLow, ok: f2ok });
      if (!f2ok) propBad.push({ f: 2, oldZone: oldZone, fireBottom: fireBottom, core: fireCore, ref: fireRef, crate: crateLow });
      /* F4：烛台杆落地 + 脚下暗面 */
      setupBattle(4, 'necromancer');
      draw();
      var cx4 = Math.round(W * 0.14);
      var cmn = 255;
      for (var y4 = 472; y4 <= 500; y4++) cmn = Math.min(cmn, lumAt(cx4, y4));
      var candShadow = lumAt(cx4, 506), candRef = lumAt(cx4 + 40, 506);
      var f4ok = cmn >= 10 && candShadow <= candRef - 5;
      propRows.push({ f: 4, poleMin: cmn, shadow: candShadow, ref: candRef, ok: f4ok });
      if (!f4ok) propBad.push({ f: 4, poleMin: cmn, shadow: candShadow, ref: candRef });
      rec('G2_propsGrounded', propBad.length === 0, {
        rule: 'F1/F5 火把杆连续落到地面、F2 篝火落在地面（旧悬空区无亮像素）+ 木箱底贴地、F4 烛台杆落地且有接触暗面',
        bad: propBad, rows: propRows
      });

      /* ══ H：亮度全层复核 ═══════════════════════════════ */
      var hRows = [], hBad = [];
      for (var hf = 1; hf <= 5; hf++) {
        c.setTransform(1, 0, 0, 1, 0, 0);
        c.fillStyle = '#000000'; c.fillRect(0, 0, W, H);
        R._battleBackdrop(c, W, H, hf);
        var monRect = maxLumRect(W / 2 - 64, 60, W / 2 + 64, 190);
        var plyRect = maxLumRect(W / 2 - 60, 444, W / 2 + 60, 544);
        var blockMax = 0, blockAt = null;
        for (var by = 0; by + 32 <= H; by += 32) {
          for (var bx = 0; bx + 32 <= W; bx += 32) {
            var bm = meanLumRect(bx, by, bx + 32, by + 32);
            if (bm > blockMax) { blockMax = bm; blockAt = { x: bx, y: by }; }
          }
        }
        var ids = MAPS.enemyTable[hf - 1].map(function (e) { return e.id; });
        for (var bi2 = 0; bi2 < MAPS.bosses.length; bi2++) if (MAPS.bosses[bi2].floor === hf) ids.push(MAPS.bosses[bi2].id);
        var means = [], p90s = [];
        for (var ii = 0; ii < ids.length; ii++) {
          var ss = spriteStats(ids[ii]);
          if (ss) { means.push(ss.mean); p90s.push(ss.p90); }
        }
        var minMean = Math.min.apply(null, means), minP90 = Math.min.apply(null, p90s);
        var knight = statsOf(S.getFrame('knight_m_idle', 0));
        var ok = monRect.max < minMean - 10 && plyRect.max < knight.mean - 10 &&
          blockMax < minP90 - 5 && monRect.max < knight.max && plyRect.max < knight.max;
        hRows.push({ f: hf, monMax: monRect.max, monAt: monRect.at, plyMax: plyRect.max, blockMax: blockMax, blockAt: blockAt,
          minMean: minMean, minP90: minP90, knightMean: knight.mean, ok: ok });
        if (!ok) hBad.push(hRows[hRows.length - 1]);
      }
      rec('H1_subjectBrightness', hBad.length === 0, {
        rule: '任何层：怪物/玩家所在矩形的背景峰值必须低于该层最暗怪物的均值-10；最大 32×32 背景块均值必须低于该层最暗怪物 p90-5',
        bad: hBad, rows: hRows
      });

      /* F3 熔岩：改后 vs 改前（改前实测 200/130/38/337，来自 D-88 实拍同区测量） */
      c.setTransform(1, 0, 0, 1, 0, 0);
      c.fillStyle = '#000000'; c.fillRect(0, 0, W, H);
      R._battleBackdrop(c, W, H, 3);
      var lavas = [];
      var lavaMax = -1, lavaBright = 0;
      for (var ly = 380; ly < 440; ly++) {
        for (var lx = 0; lx < W; lx++) {
          if (lx >= W * 0.16 && lx <= W * 0.84) continue;
          var lv = lumAt(lx, ly);
          lavas.push(lv);
          if (lv > lavaMax) lavaMax = lv;
          if (lv >= 170) lavaBright++;
        }
      }
      lavas.sort(function (a, b) { return a - b; });
      var lavaP95 = lavas[Math.floor(lavas.length * 0.95)];
      var lavaMean = Math.round(lavas.reduce(function (a, b) { return a + b; }, 0) / lavas.length);
      var wogol = spriteStats('wogol');
      var before = { max: 200, p95: 130, mean: 38, bright: 337 };
      var f3ok = lavaMax <= before.max - 10 && lavaP95 <= before.p95 - 10 && lavaMean <= Math.round(before.mean * 0.8) &&
        lavaBright <= Math.ceil(before.bright * 0.1) && lavaP95 <= wogol.p90 && lavaMax < wogol.max;
      rec('H2_f3Lava', f3ok, {
        rule: 'F3 熔岩区（y380-440 两侧）压暗：峰值 ≤ 改前-10、p95 ≤ 改前-10、均值 ≤ 改前×0.8、≥170 亮部 ≤ 改前×10%，且 p95 不高于沃古尔 p90',
        before: before, after: { max: lavaMax, p95: lavaP95, mean: lavaMean, bright: lavaBright }, wogol: wogol
      });

      /* ══ I：龙的原生体量与三 Boss 主次 ═══════════════════ */
      var frames = ['idle', 'attack', 'hurt'];
      var nativeBad = [], nativeAll = [];
      for (var fi = 0; fi < frames.length; fi++) {
        for (var fj = 0; fj < 4; fj++) {
          var img = S.getFrame('dragon_' + frames[fi], fj);
          if (!img) { nativeBad.push(frames[fi] + fj + ':missing'); continue; }
          var dh = R.bossDrawHeight(img);
          nativeAll.push({ f: frames[fi] + fj, w: img.naturalWidth, h: img.naturalHeight, draw: dh });
          if (img.naturalWidth !== 72 || img.naturalHeight !== 72 || dh !== 144) nativeBad.push(frames[fi] + fj);
        }
      }
      var others = [], otherBad = [];
      ['ogre_boss', 'zombie_king'].forEach(function (id) {
        var im = S.getFrame(R.MONSTER_ANIM[id].idle, 0);
        var h2 = im ? R.bossDrawHeight(im) : 0;
        others.push({ id: id, h: h2, w: im ? Math.round(im.naturalWidth * h2 / im.naturalHeight) : 0 });
        if (h2 !== 108) otherBad.push(id);
      });
      setupBattle(5, 'dragon');
      T = 0;
      var db = draw();
      var mbox = db.monster;
      var noHud = mbox.y >= 22;
      var noNameHp = mbox.y + mbox.h <= 202;
      var noSafe = mbox.y + mbox.h < 236;
      var areaDragon = mbox.w * mbox.h;
      var areaOther = others.map(function (o) { return o.w * o.h; });
      var hierarchy = mbox.h > others[0].h && mbox.h > others[1].h &&
        areaDragon >= 1.6 * areaOther[0] && areaDragon >= 1.6 * areaOther[1];
      rec('I1_dragonSize', nativeBad.length === 0 && otherBad.length === 0 && hierarchy && noHud && noNameHp && noSafe && R.BOSS_MUL === 2, {
        rule: '龙原生 72×72、落屏 144×144（整数倍 2）；三 Boss 中龙最高最大（高度 > 108，面积 ≥ 1.6×）；不遮 HUD(22)、不压名称/血条(202/212)、不进安全带(236+)',
        nativeBad: nativeBad, frames: nativeAll.length,
        dragonBox: { x: mbox.x, y: mbox.y, w: mbox.w, h: mbox.h, bottom: mbox.y + mbox.h },
        others: others, areaRatio: [r2(areaDragon / areaOther[0]), r2(areaDragon / areaOther[1])],
        bossMul: R.BOSS_MUL, noHud: noHud, noNameHp: noNameHp, noSafe: noSafe
      });

      evidence();
    } catch (e) {
      out.ok = false;
      out.error = String(e && (e.stack || e.message) || e);
      finish();
    }
  }

  /* ══ D：本轮证据文件登记（按实际尺寸逐张核对，缺一张即判负）══ */
  var EVID = [
    ['bg-f1.png', 1280, 800], ['bg-f2.png', 1280, 800], ['bg-f3.png', 1280, 800],
    ['bg-f4.png', 1280, 800], ['bg-f5.png', 1280, 800], ['bg-five-together.png', 1900, 850],
    ['bg-before-after-f2.png', 1830, 597], ['bg-before-after-f3.png', 1830, 597],
    ['body-displacement-monster.png', 1420, 271], ['body-displacement-player.png', 1420, 258],
    ['spark-contact-4x.png', 960, 720], ['shadow-5f.png', 1560, 310],
    ['dragon-3boss.png', 980, 400], ['dragon-head-1x.png', 115, 115],
    ['dragon-head-8x.png', 920, 920], ['dragon-native-8x.png', 1768, 626],
    ['hit-monster-t000.png', 1280, 800], ['hit-monster-t025.png', 1280, 800],
    ['hit-monster-t050.png', 1280, 800], ['hit-monster-t060.png', 1280, 800],
    ['hit-monster-t075.png', 1280, 800], ['hit-monster-t090.png', 1280, 800],
    ['counter-t100.png', 1280, 800], ['counter-t125.png', 1280, 800],
    ['counter-t150.png', 1280, 800], ['counter-t160.png', 1280, 800],
    ['counter-t175.png', 1280, 800], ['counter-t190.png', 1280, 800]
  ];
  function evidence() {
    var done = 0, bad = [];
    function tick() {
      if (++done < EVID.length) return;
      rec('D1_evidence', bad.length === 0, {
        rule: '本轮实拍证据必须存在且尺寸与登记完全一致（缺一张/尺寸不符即判负）',
        n: EVID.length, bad: bad
      });
      finish();
    }
    EVID.forEach(function (e) {
      var im = new Image();
      im.onload = function () {
        if (im.naturalWidth !== e[1] || im.naturalHeight !== e[2]) {
          bad.push({ f: e[0], got: [im.naturalWidth, im.naturalHeight], want: [e[1], e[2]] });
        }
        tick();
      };
      im.onerror = function () { bad.push({ f: e[0], got: 'missing' }); tick(); };
      im.src = 'artifacts/d89/' + e[0];
    });
  }

  function finish() {
    var txt = (out.ok ? 'PASS ' : 'FAIL ') + JSON.stringify(out);
    document.title = txt;
    document.getElementById('result').textContent = txt;
  }

  S.load();
  (function poll() {
    if (S.isReady() && S.get('t5_floor_1') && S.get('dragon_idle_anim_f0') && S.get('knight_m_idle_anim_f0')) {
      boot();
      return;
    }
    setTimeout(poll, 60);
  })();
})();
</script>
