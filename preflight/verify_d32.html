<script>
/* D-33 改造：
 * 1) 旧路径判定从「任意子串包含」改为「路径形态」（D-33 裁定一）——改扫描器，不改被检查的文档；
 * 2) A3 分两栏：功能性残留（必须 0）/ 历史提及（数量 + 文件），不合并成一个数字（裁定二）；
 * 3) 线上轻量模式：file:// 永远跑全量；http(s) 下 1.1s 内跑不完则退到 online-lite 并显式打印（裁定四）。
 */
(function () {
  'use strict';
  var out = { ok: true, sub: {} };
  function rec(name, ok, d) {
    out.sub[name] = { ok: !!ok, d: d };
    if (!ok) out.ok = false;
  }

  var LITE_FORCED = /[?&]lite=1/.test(location.search);
  var IS_FILE = location.protocol === 'file:';
  var MODE = 'full';
  var CACHE = {}, textQ = [], binQ = [];
  var LOADED = 0, TOTAL = 0, DONE = false, EMITTED = null;

  function tick() {
    LOADED++;
    if (!DONE && !EMITTED) {
      document.getElementById('result').textContent = 'LOADING ' + LOADED + '/' + (TOTAL || '?');
    }
  }
  function collectText(p) { if (!(p in CACHE)) { CACHE[p] = ''; textQ.push(p); } }
  function collectBin(p) { if (!(p in CACHE)) { CACHE[p] = null; binQ.push(p); } }
  function read(p) { return CACHE[p] || ''; }
  function readBin(p) { return CACHE[p] || null; }
  function fetchText(p, cb) {
    try {
      var x = new XMLHttpRequest();
      x.open('GET', p, true);
      x.onload = x.onerror = x.ontimeout = function () { CACHE[p] = x.responseText || ''; cb(); };
      x.send(null);
    } catch (e) { CACHE[p] = ''; cb(); }
  }
  function fetchBin(p, cb) {
    /* Window 下同步 XHR 不允许 responseType='arraybuffer'，用 x-user-defined 拿字节 */
    try {
      var x = new XMLHttpRequest();
      x.open('GET', p, true);
      try { x.overrideMimeType('text/plain; charset=x-user-defined'); } catch (e2) { /* noop */ }
      x.onload = x.onerror = x.ontimeout = function () {
        var s = x.responseText || '';
        if (!s) { CACHE[p] = null; return cb(); }
        var u8 = new Uint8Array(s.length);
        for (var i = 0; i < s.length; i++) u8[i] = s.charCodeAt(i) & 0xff;
        CACHE[p] = u8; cb();
      };
      x.send(null);
    } catch (e) { CACHE[p] = null; cb(); }
  }
  function runAll(list, fn, cb) {
    var n = list.length;
    if (!n) return cb();
    list.forEach(function (p) {
      fn(p, function () { tick(); n--; if (n === 0) cb(); });
    });
  }

  function fnvText(str) {
    var h = 0x811c9dc5;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  function fnvBytes(u8) {
    var h = 0x811c9dc5;
    for (var i = 0; i < u8.length; i++) {
      h ^= u8[i];
      h = (h + ((h << 1) + (h << 4) + (h << 7) + (h << 8) + (h << 24))) >>> 0;
    }
    return ('00000000' + h.toString(16)).slice(-8);
  }
  var norm = function (s) { return s.replace(/\r\n/g, '\n'); };
  function utf8Len(s) {
    try { return new TextEncoder().encode(s).length; } catch (e) { return -1; }
  }

  /* ══ 旧路径判定：只认「路径形态」，不认任意子串（D-33 裁定一） ═══════
   * new   : 前缀解析为 docs/process/ —— 正确的新路径，直接放行
   * old   : 前缀是 ./ ../ / 路径片段，或行首裸名（含 file:///…/名）—— 功能性旧路径
   * bare  : 正文中以书名号 / 反引号包住的文件提及 —— 历史提及
   * 另外前后必须是边界：避免把「对标自检报告.md」里的「自检报告.md」算成一次引用。 */
  var PATH_CH = /[A-Za-z0-9_.\/~\\-]/;
  var WORD = /[A-Za-z0-9_]/;
  var CJK = /[\u3400-\u9fff]/;
  function prefixOf(text, i) {
    var s = i, lo = Math.max(0, i - 200);
    while (s > lo && PATH_CH.test(text.charAt(s - 1))) s--;
    return text.slice(s, i);
  }
  function boundaryOk(text, i, len) {
    var a = i > 0 ? text.charAt(i - 1) : '';
    var b = (i + len) < text.length ? text.charAt(i + len) : '';
    return !WORD.test(a) && !WORD.test(b) && !CJK.test(a);
  }
  function classifyAt(text, i) {
    var p = prefixOf(text, i);
    if (/(^|\/)docs\/process\/$/.test(p)) return 'new';
    if (p !== '') return 'old';
    var ls = text.lastIndexOf('\n', i - 1) + 1;
    return /^[\s>*\-|`]*$/.test(text.slice(ls, i)) ? 'old' : 'bare';
  }
  var TOKENS = ['preflight/shots_resize', '自检报告.md', '修复报告.md', '诊断报告.md', '对标自检报告.md'];
  function isHistFile(name) {
    return /^docs\/tasks\//.test(name) || /^docs\/process\//.test(name) || name === 'preflight/verify_d31.html';
  }
  function lineNo(text, i) {
    var n = 1;
    for (var k = 0; k < i && k < text.length; k++) if (text.charAt(k) === '\n') n++;
    return n;
  }
  /* 返回 { fn: [功能性残留（必须 0）], hist: {文件: 次数}, histTotal, kinds: {old,bare} } */
  function scanFiles(files) {
    var r = { fn: [], hist: {}, histTotal: 0, old: 0, bare: 0 };
    files.forEach(function (f) {
      TOKENS.forEach(function (tk) {
        var i = -1;
        while ((i = f.text.indexOf(tk, i + 1)) >= 0) {
          if (!boundaryOk(f.text, i, tk.length)) continue;
          var c = classifyAt(f.text, i);
          if (c === 'new') continue;
          if (isHistFile(f.name)) {
            r.hist[f.name] = (r.hist[f.name] || 0) + 1;
            r.histTotal++;
            if (c === 'old') r.old++; else r.bare++;
          } else {
            r.fn.push(f.name + ':' + lineNo(f.text, i) + ' ' + tk + '（' + c + '）');
          }
        }
      });
    });
    return r;
  }
  function histText(r) {
    var keys = Object.keys(r.hist).sort();
    return '共 ' + r.histTotal + ' 处［' + keys.map(function (k) { return k + '×' + r.hist[k]; }).join('、') + '］';
  }

  var MAN = null, BASE = null, SCAN = null;
  var CORE = ['PLAN.md', 'README.md', 'CHANGELOG.md', '规划-对标补齐.md'];
  var FALLBACK_MOVES = [
    { old: '自检报告.md', next: 'docs/process/自检报告.md' },
    { old: '修复报告.md', next: 'docs/process/修复报告.md' },
    { old: '诊断报告.md', next: 'docs/process/诊断报告.md' },
    { old: '对标自检报告.md', next: 'docs/process/对标自检报告.md' }
  ];
  var MUST_STAY = ['verify_d31.html', 'verify_d29.html', 'verify_d22.html'];
  var PROCESS_HTML = ['verify_d31.html', 'verify_d22.html', 'verify_d02.html'];

  /* ══ 全量模式（本地 file:// 恒走此路）═══════════════════════════ */
  function startFull() {
    MODE = 'full';
    runAll(['selfcheck/d32-move-manifest.json', 'selfcheck/page-baseline.json', 'selfcheck/d32-scanlist.json'],
      fetchText, function () {
        try { MAN = JSON.parse(read('selfcheck/d32-move-manifest.json') || 'null'); } catch (e) { MAN = null; }
        try { BASE = JSON.parse(read('selfcheck/page-baseline.json') || 'null'); } catch (e) { BASE = null; }
        try { SCAN = JSON.parse(read('selfcheck/d32-scanlist.json') || 'null'); } catch (e) { SCAN = null; }

        if (MAN) {
          MAN.moves.forEach(function (m) { collectText('../' + m.next); collectText('../' + m.old); });
          MAN.shots.files.forEach(function (f) { collectBin('artifacts/shots_resize/' + f.name); });
          collectBin('shots_resize/' + MAN.shots.files[0].name);
        }
        if (SCAN && SCAN.files) SCAN.files.forEach(function (p) { collectText('../' + p); });
        CORE.forEach(function (f) { collectText('../' + f); collectText('../docs/process/' + f); });
        MUST_STAY.forEach(function (p) { collectText(p); });
        PROCESS_HTML.forEach(function (p) { collectText('../docs/process/' + p); });
        collectText('artifacts/README.md');
        collectText('../README.md');
        collectText('../CHANGELOG.md');
        collectText('../docs/process/自检报告.md');

        TOTAL = textQ.length + binQ.length + 3;
        var waves = 2;
        function waveDone() { waves--; if (waves === 0) assertFull(); }
        runAll(textQ, fetchText, waveDone);
        runAll(binQ, fetchBin, waveDone);
      });
  }

  function assertFull() {
    if (EMITTED === 'full') return;
    DONE = true;
    out = { ok: true, sub: {} };

    /* A1 */
    var a1miss = [];
    if (!MAN) a1miss.push('台账不可读');
    else MAN.moves.forEach(function (m) { if (!read('../' + m.next)) a1miss.push(m.next); });
    rec('A1_newPathsExist', !!MAN && a1miss.length === 0,
      '台账 ' + (MAN ? MAN.moves.length : 0) + ' 份；新位置缺失=' + (a1miss.length ? a1miss.join(',') : '0'));

    /* A2 */
    var a2alive = [];
    if (MAN) {
      MAN.moves.forEach(function (m) { if (read('../' + m.old)) a2alive.push('../' + m.old); });
      if (readBin('shots_resize/' + MAN.shots.files[0].name)) a2alive.push('shots_resize/');
    }
    rec('A2_oldPathsGone', !!MAN && a2alive.length === 0,
      '根目录旧文件 + 旧截图目录；仍可读到=' + (a2alive.length ? a2alive.join(',') : '0'));

    /* A3：两栏打印 */
    var SCANNED = [];
    if (SCAN && SCAN.files) {
      SCAN.files.forEach(function (p) { var t = read('../' + p); if (t) SCANNED.push({ name: p, text: t }); });
    }
    var rs = scanFiles(SCANNED);
    rec('A3_noOldPathReferences', !!SCAN && SCANNED.length >= 200 && rs.fn.length === 0,
      '扫描 ' + SCANNED.length + ' 份源码/文档（清单 ' + (SCAN ? SCAN.count : 0) + '）；取数 ' + LOADED + '/' + TOTAL +
      '｜功能性残留（必须 0）= ' + rs.fn.length + (rs.fn.length ? '：' + rs.fn.slice(0, 4).join('，') : '') +
      '｜历史提及（不计入残留）= ' + histText(rs) + '［旧形态 ' + rs.old + ' / 正文提及 ' + rs.bare + '］');

    /* A4 */
    function coreCheck(map) { return CORE.filter(function (f) { return !(map[f] || ''); }); }
    var coreMap = {};
    CORE.forEach(function (f) { coreMap[f] = read('../' + f); });
    var coreGone = coreCheck(coreMap);
    var copiedToProcess = CORE.filter(function (f) { return read('../docs/process/' + f); });
    rec('A4_coreDocsStayInRoot', coreGone.length === 0 && copiedToProcess.length === 0,
      '根目录仍在=' + (CORE.length - coreGone.length) + '/4' +
      (coreGone.length ? '；缺失=' + coreGone.join(',') : '') +
      '；被误搬进 docs/process/=' + (copiedToProcess.length ? copiedToProcess.join(',') : '0'));

    /* A5 */
    var a5bad = [];
    if (MAN) {
      MAN.moves.forEach(function (m) {
        var t = read('../' + m.next);
        var body = t.slice(t.indexOf('\n') + 1);
        var h = fnvText(norm(body)), n = utf8Len(body);
        if (h !== m.bodyHash || n !== m.bodyBytes) {
          a5bad.push(m.next + '：hash ' + h + '/' + m.bodyHash + '，bytes ' + n + '/' + m.bodyBytes);
        }
      });
    }
    rec('A5_movedBodiesUnchanged', !!MAN && a5bad.length === 0,
      '逐份比对「来源说明行之后的正文」与 d32-before.json 的 LF 归一 FNV-1a；不一致=' +
      (a5bad.length ? a5bad.join(' ｜ ') : '0'));

    /* A6 */
    var a6bad = [], a6ok = !!MAN && MAN.shots.count === 12;
    if (MAN) {
      MAN.shots.files.forEach(function (f) {
        var u8 = readBin('artifacts/shots_resize/' + f.name);
        if (!u8) { a6bad.push(f.name + '：读不到'); return; }
        if (u8.length !== f.bytes) a6bad.push(f.name + '：bytes ' + u8.length + '/' + f.bytes);
        else if (fnvBytes(u8) !== f.hash) a6bad.push(f.name + '：hash 不符');
      });
    }
    rec('A6_twelveShotsMoved', a6ok && a6bad.length === 0,
      '台账 ' + (MAN ? MAN.shots.files.length : 0) + ' 张；新目录实测异常=' + (a6bad.length ? a6bad.join(',') : '0'));

    /* A7 */
    var a7bad = [];
    if (MAN) {
      MAN.moves.forEach(function (m) {
        var t = read('../' + m.next);
        if (t.indexOf(m.note) !== 0) a7bad.push(m.next + '：来源说明不在首行');
        if (t.indexOf('2026-11-12') < 0 || t.indexOf(m.old) < 0) a7bad.push(m.next + '：缺原路径或日期');
      });
    }
    var shotNote = read('artifacts/README.md');
    if (!shotNote || shotNote.indexOf('2026-11-12') < 0) a7bad.push('artifacts/README.md：缺来源说明');
    rec('A7_provenanceNote', !!MAN && a7bad.length === 0,
      '4 份报告首行来源说明 + 截图目录 README；问题=' + (a7bad.length ? a7bad.join(',') : '0'));

    /* A8 */
    var movedAway = MUST_STAY.filter(function (p) { return !read(p); });
    var htmlInProcess = PROCESS_HTML.filter(function (p) { return read('../docs/process/' + p); });
    rec('A8_verifyPagesUntouched', movedAway.length === 0 && htmlInProcess.length === 0,
      '抽查 3 页仍在 preflight/=' + (MUST_STAY.length - movedAway.length) + '/3' +
      (movedAway.length ? '；缺失=' + movedAway.join(',') : '') +
      '；被搬进 docs/process/=' + (htmlInProcess.length ? htmlInProcess.join(',') : '0'));

    /* A9：基线页数是人工维护的硬数字——每新增一张验证页必须同步改这里
     * （D-34：74→75；D-35：75→76，新增 verify_d35；D-36：76→77，新增 verify_d36；
     *   D-37：77→78，新增 verify_d37；D-38：78→79，新增 verify_d38；
     *   D-39：79→80，新增 verify_d39；D-40：80→81，新增 verify_d40；D-41：81→82，新增 verify_d41；D-42：82→83，新增 verify_d42；
     *   D-43：83→84，新增 verify_d43；D-44：84→85，新增 verify_d44；D-45：85→86，新增 verify_d45；
     *   D-46：86→87，新增 verify_d46；D-47：87→88，新增 verify_d47；D-48：88→89，新增 verify_d48；
     *   D-49：89→90，新增 verify_d49；D-50：90→91，新增 verify_d50）。
     * 这是基线变更，不是放宽断言。 */
    var a9 = !!BASE && BASE.count === 91 && Array.isArray(BASE.pages) &&
      BASE.pages.length === 91 && BASE.pages.indexOf('verify_d32') >= 0;
    rec('A9_pageBaselineAligned', a9,
      'count=' + (BASE ? BASE.count : 'n/a') + '；pages.length=' +
      (BASE && BASE.pages ? BASE.pages.length : 'n/a') +
      '；含 verify_d32=' + (BASE && BASE.pages ? BASE.pages.indexOf('verify_d32') >= 0 : 'n/a'));

    /* A10 */
    var README = read('../README.md'), LOG = read('../CHANGELOG.md');
    var a10 = README.indexOf('docs/process/') >= 0 && README.indexOf('preflight/artifacts/') >= 0 &&
      README.indexOf('验证页 91 个') >= 0 &&
      LOG.indexOf('阶段 B1 目录归位') >= 0 && LOG.indexOf('阶段 B2') >= 0;
    rec('A10_docsUpdated', a10,
      'README 含 docs/process=' + (README.indexOf('docs/process/') >= 0) +
      ' / preflight/artifacts=' + (README.indexOf('preflight/artifacts/') >= 0) +
      ' / 验证页 91 个=' + (README.indexOf('验证页 91 个') >= 0) +
      '；CHANGELOG 含 B1=' + (LOG.indexOf('阶段 B1 目录归位') >= 0) +
      ' B2=' + (LOG.indexOf('阶段 B2') >= 0));

    /* A11：路径形态匹配器的正负例（裁定一）*/
    var negText = '依据：[对标自检报告](docs/process/对标自检报告.md)，另见 `docs/process/自检报告.md` 与 preflight/artifacts/shots_resize/';
    var posText = '../对标自检报告.md\nfile:///d:/work/自检报告.md\n诊断报告.md\n见 `修复报告.md` 与 ../preflight/shots_resize/shot_1280x720.png';
    var negRs = scanFiles([{ name: 'synthetic/negative.md', text: negText }]);
    var posRs = scanFiles([{ name: 'synthetic/positive.md', text: posText }]);
    var a11 = negRs.fn.length === 0 && posRs.fn.length === 5;
    rec('A11_pathFormMatcher', a11,
      '指向新路径的引用命中=' + negRs.fn.length + '（必须 0）' + (negRs.fn.length ? '：' + negRs.fn.join('，') : '') +
      '；指向旧路径的引用命中=' + posRs.fn.length + '（必须 5：../ 形态、file:/// 形态、行首裸名、正文提及、旧截图目录）' +
      (posRs.fn.length ? '：' + posRs.fn.join('，') : ''));

    /* A12：规划-对标补齐.md 的引用必须是人能点开的新路径（裁定一）*/
    var PLAN2 = read('../规划-对标补齐.md');
    var citeLine = (PLAN2.split('\n').filter(function (l) { return l.indexOf('依据：') >= 0; })[0] || '');
    var planRs = scanFiles([{ name: '规划-对标补齐.md', text: PLAN2 }]);
    var a12 = /\[对标自检报告\]\(docs\/process\/对标自检报告\.md\)/.test(citeLine) &&
      citeLine.indexOf('.md') > 0 && citeLine.indexOf('\u200b') < 0 && planRs.fn.length === 0;
    rec('A12_planCitationClickable', a12,
      '行首依据行=' + JSON.stringify(citeLine.slice(0, 90)) +
      '；含 markdown 链接=' + /\[对标自检报告\]\(docs\/process\/对标自检报告\.md\)/.test(citeLine) +
      '；零宽字符=' + (citeLine.indexOf('\u200b') >= 0) + '；该文件功能性残留=' + planRs.fn.length);

    /* N1 */
    var mutMove = {};
    Object.keys(coreMap).forEach(function (k) { mutMove[k] = coreMap[k]; });
    mutMove['规划-对标补齐.md'] = '';
    var n1 = coreCheck(coreMap).length === 0 && coreCheck(mutMove).length === 1 &&
      coreCheck(mutMove)[0] === '规划-对标补齐.md';
    rec('N1_negativeOverMoveFails', n1,
      '真实缺失=' + coreCheck(coreMap).length + '；模拟搬走「规划-对标补齐.md」后缺失=' + JSON.stringify(coreCheck(mutMove)));

    /* N2 */
    var mutFiles = SCANNED.slice(0, 3).map(function (f) { return { name: f.name, text: f.text }; });
    mutFiles.push({ name: 'README.md', text: (README || '') + '\n见 ../preflight/shots_resize/shot_1280x720.png' });
    var mutRs = scanFiles(mutFiles);
    var n2 = rs.fn.length === 0 && mutRs.fn.length === 1;
    rec('N2_negativeResidueFails', n2,
      '真实功能性残留=' + rs.fn.length + '；注入 `../preflight/shots_resize/…` 后残留=' + JSON.stringify(mutRs.fn));

    /* N3 */
    var t0 = read('../docs/process/自检报告.md');
    var body0 = t0.slice(t0.indexOf('\n') + 1);
    var mutBody = (body0.charAt(0) === 'Z' ? 'Y' : 'Z') + body0.slice(1);
    var ref = null;
    if (MAN) MAN.moves.forEach(function (m) { if (/^docs\/process\/自检报告\.md$/.test(m.next)) ref = m.bodyHash; });
    var n3 = !!ref && fnvText(norm(body0)) === ref && fnvText(norm(mutBody)) !== ref;
    rec('N3_negativeByteFlipFails', n3,
      '真实哈希命中=' + (fnvText(norm(body0)) === ref) + '；把首字符改成 ' + JSON.stringify(mutBody.charAt(0)) +
      ' 后命中=' + (fnvText(norm(mutBody)) === ref));

    emit('full');
  }

  /* ══ 线上轻量模式（裁定四）：≤13 次取数，明确标记 online-lite ════ */
  var LITE_FILES = ['selfcheck/d32-move-manifest.json', 'selfcheck/page-baseline.json',
    '../README.md', '../CHANGELOG.md', '../规划-对标补齐.md'];
  function startLite() {
    MODE = 'online-lite';
    var q = LITE_FILES.slice();
    (MAN ? MAN.moves : FALLBACK_MOVES).forEach(function (m) { q.push('../' + m.next); });
    CORE.forEach(function (f) { q.push('../' + f); });
    q = q.filter(function (p, i) { return q.indexOf(p) === i; });
    runAll(q, fetchText, assertLite);
  }
  function assertLite() {
    if (EMITTED === 'full') return;
    out = { ok: true, sub: {} };
    var man = null, base = null;
    try { man = JSON.parse(read('selfcheck/d32-move-manifest.json') || 'null'); } catch (e) { man = null; }
    try { base = JSON.parse(read('selfcheck/page-baseline.json') || 'null'); } catch (e) { base = null; }
    var names = man ? man.moves : FALLBACK_MOVES;
    var newMiss = names.filter(function (m) { return !read('../' + m.next); }).map(function (m) { return m.next; });
    rec('L1_newPathsExist', newMiss.length === 0,
      '4 份报告新路径存在=' + (names.length - newMiss.length) + '/' + names.length +
      (newMiss.length ? '；缺=' + newMiss.join(',') : ''));

    var coreMiss = CORE.filter(function (f) { return !read('../' + f); });
    rec('L2_coreDocsInRoot', coreMiss.length === 0,
      'PLAN/README/CHANGELOG/规划 仍在根目录=' + (CORE.length - coreMiss.length) + '/4' +
      (coreMiss.length ? '；缺=' + coreMiss.join(',') : ''));

    var a9 = !!base && base.count === 83 && Array.isArray(base.pages) &&
      base.pages.length === 83 && base.pages.indexOf('verify_d32') >= 0;
    rec('L3_pageBaselineAligned', a9,
      'count=' + (base ? base.count : 'n/a') + '；含 verify_d32=' +
      (base && base.pages ? base.pages.indexOf('verify_d32') >= 0 : 'n/a'));

    var README = read('../README.md'), LOG = read('../CHANGELOG.md'), PLAN2 = read('../规划-对标补齐.md');
    rec('L4_readmeUpdated', README.indexOf('docs/process/') >= 0 && README.indexOf('preflight/artifacts/') >= 0 &&
      README.indexOf('验证页 80 个') >= 0,
      'README 关键锚点 docs/process=' + (README.indexOf('docs/process/') >= 0) +
      ' / preflight/artifacts=' + (README.indexOf('preflight/artifacts/') >= 0) +
      ' / 80 个=' + (README.indexOf('验证页 80 个') >= 0));

    rec('L5_changelogUpdated', LOG.indexOf('阶段 B1 目录归位') >= 0 && LOG.indexOf('阶段 B2') >= 0,
      'CHANGELOG 含 B1=' + (LOG.indexOf('阶段 B1 目录归位') >= 0) + ' B2=' + (LOG.indexOf('阶段 B2') >= 0));

    var cite = (PLAN2.split('\n').filter(function (l) { return l.indexOf('依据：') >= 0; })[0] || '');
    rec('L6_planCitationClickable', /\[对标自检报告\]\(docs\/process\/对标自检报告\.md\)/.test(cite),
      '依据行含可点击新路径=' + /\[对标自检报告\]\(docs\/process\/对标自检报告\.md\)/.test(cite));

    emit('online-lite');
  }

  function emit(mode) {
    if (EMITTED === 'full') return;          /* 全量已经出过裁决，轻量不得回写降级 */
    EMITTED = mode;
    var keys = Object.keys(out.sub);
    var failed = keys.filter(function (k) { return !out.sub[k].ok; });
    var head = (out.ok ? 'PASS ' : 'FAIL ') + JSON.stringify({
      mode: mode, ok: out.ok, n: keys.length, fail: failed,
      attempted: mode === 'online-lite' ? (LOADED + '/' + (TOTAL || '?')) : undefined
    });
    var note = mode === 'online-lite'
      ? '\nmode=online-lite（线上轻量模式：全量 ' + (TOTAL || '?') + ' 份仍在取数，已取 ' + LOADED +
        ' 份；本裁决**只覆盖关键 ' + keys.length + ' 项，不代表全量残留扫描通过**，全量结论以本地 run-all 为准）'
      : '\nmode=full（本地全量：' + (TOTAL || '?') + ' 份取数完成）';
    document.getElementById('result').textContent = head + note + '\n\n' +
      keys.map(function (k) { return (out.sub[k].ok ? '  ✓ ' : '  ✗ ') + k + ' — ' + out.sub[k].d; }).join('\n');
    document.title = head;
  }

  /* ── 入口 ──────────────────────────────────────────────────────
   * file://（本地 run-all）：只跑全量，绝不退轻量。
   * http(s)（线上）：两路同时起——轻量先出裁决（≤13 次取数，抓取窗口内可得），
   *   全量跑完后用 mode=full 覆盖；若全量没跑完，页面上就是线上轻量裁决 + 已取份数。 */
  if (LITE_FORCED) startLite();
  else if (IS_FILE) startFull();
  else { startLite(); startFull(); }
})();
</script>
