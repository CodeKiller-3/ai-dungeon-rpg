<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>D-40 刷满（M1）测量</title>
<style>
  body { background:#111; color:#ddd; font:13px/1.5 Consolas,monospace; margin:12px; }
  h1 { font-size:15px; color:#7fd1ff; margin:0 0 8px; }
  pre { white-space:pre-wrap; word-break:break-all; }
  canvas { position:fixed; left:-9999px; top:0; }
</style>
</head>
<body>
<h1>D-40 · M1「刷满」测量页：不参与 run-all 回归，只产出 d40-m1.json</h1>
<pre id="report">RUNNING</pre>
<canvas id="game" width="1024" height="640"></canvas>
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>

<script src="../js/core/eventBus.js"></script>
<script src="../js/core/sprites.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/render.js"></script>
<script src="../js/data/maps.js"></script>
<script src="../js/data/monsters.js"></script>
<script src="../js/data/items.js"></script>
<script src="../js/data/quests.js"></script>
<script src="../js/data/skills.js"></script>
<script src="../js/data/dialogue.js"></script>
<script src="../js/data/reactions.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/vendor/astar.js"></script>
<script src="../js/vendor/howler.min.js"></script>
<script src="../js/vendor/rot.min.js"></script>
<script src="../js/systems/map.js"></script>
<script src="../js/systems/fov.js"></script>
<script src="../js/systems/hud.js"></script>
<script src="../js/systems/modal.js"></script>
<script src="../js/systems/feedback.js"></script>
<script src="../js/systems/notice.js"></script>
<script src="../js/systems/lighting.js"></script>
<script src="../js/systems/motion.js"></script>
<script src="../js/systems/particles.js"></script>
<script src="../js/systems/fx.js"></script>
<script src="../js/systems/quest.js"></script>
<script src="../js/systems/skills.js"></script>
<script src="../js/systems/bestiary.js"></script>
<script src="../js/systems/battle.js"></script>
<script src="../js/systems/inventory.js"></script>
<script src="../js/systems/shop.js"></script>
<script src="../js/systems/save.js"></script>
<script src="../js/systems/leaderboard.js"></script>
<script src="../js/systems/ai.js"></script>
<script src="../js/systems/npc.js"></script>
<script src="../js/systems/audio.js"></script>
<script src="../js/systems/learner.js"></script>
<script src="../js/core/main.js"></script>
<script src="lib/d17_bot.js"></script>
<script>
/* D-40 单组跑局器：M1「刷满」。种子 1001~1050、maxActions 2500（与 G0/G2/S1 完全一致）。
 * M1 = 每层全清怪、拿宝箱、每层商店买最贵、拿到卷轴就用。没有逃跑分支。 */
(function () {
  'use strict';
  var out = { protocol: 'D-40', mode: 'm1', strategy: { clear: true }, env: {}, summary: null, runs: [] };
  function mean(a) { if (!a.length) return 0; var s = 0; for (var i = 0; i < a.length; i++) s += a[i]; return Math.round((s / a.length) * 100) / 100; }
  function agg(runs) {
    var d = {
      outcomes: { win: 0, dead: 0, stuck: 0 },
      deathFloor: {},
      floors: [],
      f5: { reached: 0, states: [] },
      extrapolated: [],
      scrolls: { runsUsed: 0, total: 0 },
      bought: { total: 0, byId: {} },
      deaths: { count: 0, bySource: {} }
    };
    var perFloor = {};
    for (var i = 0; i < runs.length; i++) {
      var r = runs[i], m = r.m1;
      if (!m) continue;
      if (r.outcome === 'win') d.outcomes.win++;
      else if (r.outcome === 'dead') d.outcomes.dead++;
      else d.outcomes.stuck++;
      if (r.outcome !== 'win') d.deathFloor[r.deathFloor || r.floor] = (d.deathFloor[r.deathFloor || r.floor] || 0) + 1;
      for (var f = 0; f < m.floors.length; f++) {
        var z = m.floors[f];
        if (!perFloor[z.floor]) perFloor[z.floor] = { atk: [], def: [], maxHp: [], level: [], gold: [], equip: [], kills: [], exp: [], actions: [] };
        perFloor[z.floor].atk.push(z.atk); perFloor[z.floor].def.push(z.def);
        perFloor[z.floor].maxHp.push(z.maxHp); perFloor[z.floor].level.push(z.level);
        perFloor[z.floor].gold.push(z.gold); perFloor[z.floor].equip.push(z.equip);
        perFloor[z.floor].kills.push(z.kills); perFloor[z.floor].exp.push(z.expGain);
        perFloor[z.floor].actions.push(z.actions);
        if (z.floor === 5) {
          d.f5.states.push({ seed: r.seed, atk: z.atk, def: z.def, maxHp: z.maxHp, level: z.level,
            hp: z.hp, gold: z.gold, equip: z.equip, weaponId: z.weaponId, armorId: z.armorId,
            weaponPlus: z.weaponPlus, armorPlus: z.armorPlus, outcome: r.outcome });
        }
      }
      if (m.scrollsUsed > 0) { d.scrolls.runsUsed++; d.scrolls.total += m.scrollsUsed; }
      for (var b = 0; b < m.bought.length; b++) {
        d.bought.total++;
        var id = m.bought[b].id;
        d.bought.byId[id] = (d.bought.byId[id] || 0) + 1;
      }
      if (m.extrapolated) {
        d.extrapolated.push({
          seed: r.seed, diedOnFloor: m.extrapolated.diedOnFloor,
          projectedLevel: m.extrapolated.projectedLevel,
          projectedAtk: m.extrapolated.projectedAtk,
          projectedDef: m.extrapolated.projectedDef,
          projectedMaxHp: m.extrapolated.projectedMaxHp,
          avgExpPerFloor: m.extrapolated.avgExpPerFloor,
          extrapolated: true
        });
      }
      if (r.death) {
        d.deaths.count++;
        var src = r.death.source || '(unknown)';
        d.deaths.bySource[src] = (d.deaths.bySource[src] || 0) + 1;
      }
    }
    for (var k in perFloor) if (perFloor.hasOwnProperty(k)) {
      var g = perFloor[k];
      d.floors.push({
        floor: +k, n: g.atk.length,
        avgAtk: mean(g.atk), avgDef: mean(g.def), avgMaxHp: mean(g.maxHp),
        avgLevel: mean(g.level), avgGold: mean(g.gold), avgEquip: mean(g.equip),
        avgKills: mean(g.kills), avgExpGain: mean(g.exp), avgActions: mean(g.actions)
      });
    }
    d.floors.sort(function (a, b) { return a.floor - b.floor; });
    d.f5.reached = d.f5.states.length;
    return d;
  }

  try {
    var M = Game.Core.Main;
    M.init();
    M.closeGuide();
    var qs = location.search || '';
    var mn = /n=(\d+)/.exec(qs);
    var n = mn ? Math.max(1, Math.min(200, +mn[1])) : 50;
    var seeds = [];
    for (var i = 1001; i < 1001 + n; i++) seeds.push(i);
    var t0 = Date.now();
    var res = Game.Bot.batch(seeds, { maxActions: 2500, m1: out.strategy });
    out.wallMs = Date.now() - t0;
    out.env = {
      ua: navigator.userAgent,
      stepMs: Game.Bot.STEP_MS,
      actionSec: Game.Bot.ACTION_SEC,
      seeds: 'seed 1001..' + (1000 + n) + ' (固定)',
      seedList: seeds,
      maxActions: 2500,
      startPosSet: (function () {
        var s = {};
        for (var j = 0; j < res.runs.length; j++) s[res.runs[j].startPos] = 1;
        return Object.keys(s).sort();
      })()
    };
    out.summary = res.summary;
    out.summary.d40 = agg(res.runs);
    out.runs = res.runs;
    out.spy = Game.Bot.spy();
    out.ok = true;
    var a = out.summary.d40;
    document.title = 'BATCH_DONE mode=m1 runs=' + res.runs.length +
      ' win=' + res.summary.win + ' dead=' + res.summary.dead + ' stuck=' + res.summary.stuck +
      ' f5=' + a.f5.reached + ' extrap=' + a.extrapolated.length +
      ' scrolls=' + a.scrolls.total + ' wallMs=' + out.wallMs;
  } catch (e) {
    out.err = String((e && (e.message + '\n' + (e.orig || e.stack))) || e);
    document.title = 'BATCH_FAIL';
  }
  window.__D40__ = out;
  document.getElementById('report').textContent = JSON.stringify(out, null, 1);
})();
</script>
</body>
</html>
