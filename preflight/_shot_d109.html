<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>D-109 纵置结果卡实拍台</title>
<style>html,body{margin:0;background:#05050a;overflow:hidden}canvas{display:block}
#err{position:fixed;left:0;top:0;color:#f66;font:11px monospace;margin:0;z-index:9}</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="err"></pre>
<!-- D-109 实拍台（artifacts 内部页，不登记 page-baseline.json）
     参数：?w=320&h=568&layout=vertical&m=slime&f=1
           &card=1   出升级结果卡（默认同时置 dying，与真实结算一致）
           &old=1    old=1 时把 Render 安全带退回旧口径（遮挡对照的"前"）
           &chips=1..4 状态 chip 组合
           &fx=1    在怪物接触点注入一次命中白闪 + 斩击弧
     出图后 window.__D109 = { W,H,layout,k,band,cards,obs,bar,dying } -->
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>
<script src="../js/core/eventBus.js"></script>
<script src="../js/core/sprites.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/render.js"></script>
<script src="../js/data/maps.js"></script>
<script src="../js/data/monsters.js"></script>
<script src="../js/data/items.js"></script>
<script src="../js/data/quests.js"></script>
<script src="../js/data/npcs.js"></script>
<script src="../js/data/skills.js"></script>
<script src="../js/data/dialogue.js"></script>
<script src="../js/data/reactions.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/vendor/astar.js"></script>
<script src="../js/vendor/howler.min.js"></script>
<script src="../js/vendor/rot.min.js"></script>
<script src="../js/systems/map.js"></script>
<script src="../js/systems/fov.js"></script>
<script src="../js/systems/hud.js"></script>
<script src="../js/systems/modal.js"></script>
<script src="../js/systems/feedback.js"></script>
<script src="../js/systems/notice.js"></script>
<script src="../js/systems/lighting.js"></script>
<script src="../js/systems/motion.js"></script>
<script src="../js/systems/particles.js"></script>
<script src="../js/systems/fx.js"></script>
<script src="../js/systems/quest.js"></script>
<script src="../js/systems/skills.js"></script>
<script src="../js/systems/bestiary.js"></script>
<script src="../js/systems/battle.js"></script>
<script src="../js/systems/inventory.js"></script>
<script src="../js/systems/shop.js"></script>
<script src="../js/systems/save.js"></script>
<script src="../js/systems/adaptive.js"></script>
<script src="../js/systems/leaderboard.js"></script>
<script src="../js/systems/ai.js"></script>
<script src="../js/systems/npc.js"></script>
<script src="../js/systems/audio.js"></script>
<script src="../js/systems/learner.js"></script>
<script src="../js/systems/juice.js"></script>
<script src="../js/core/main.js"></script>
<script>
(function () {
  'use strict';
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var p = kv.split('='); if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  var W = +(q.w || 320), H = +(q.h || 568);
  try {
    Object.defineProperty(window, 'innerWidth', { value: W, configurable: true });
    Object.defineProperty(window, 'innerHeight', { value: H, configurable: true });
  } catch (e) {}
  var M = Game.Core.Main, P = Game.Data.Player, B = Game.Systems.Battle, Map = Game.Systems.Map;
  var R = Game.Core.Render, S = Game.Core.Sprites, Fx = Game.Fx, PT = Game.Particles, Fb = Game.Feedback;
  var J = Game.Systems.Juice;

  (function hideHeadlessFps() {
    var proto = window.CanvasRenderingContext2D && window.CanvasRenderingContext2D.prototype;
    if (!proto || proto.__d109fps) return;
    var orig = proto.fillText;
    proto.fillText = function (text, x, y, maxWidth) {
      if (typeof text === 'string' && text.indexOf('FPS=') === 0) {
        text = text.replace(/^FPS=[^|]*\|\s*/, '');
      }
      if (arguments.length > 3) return orig.call(this, text, x, y, maxWidth);
      return orig.call(this, text, x, y);
    };
    proto.__d109fps = true;
  })();

  var spriteLoad = S.load;
  S.load = function () { return spriteLoad.call(this, '../assets/sprites/'); };

  var f = Math.max(1, Math.min(5, +(q.f || 1)));
  var mid = q.m || 'slime';
  var layout = (q.layout === 'vertical') ? 'vertical' : 'horizontal';
  var wantCard = q.card === '1';
  var wantOld = q.old === '1';
  var wantFx = q.fx === '1';
  var chipN = Math.max(0, Math.min(4, +(q.chips || 0)));
  var dying = wantCard && q.alive !== '1';
  var sceneReady = false, drawn = 0;

  /* 旧口径：忽略本帧绘制框，走 D-109 之前的固定上下界（只用于"前"对照） */
  if (wantOld && R && typeof R._battleSafeBand === 'function') {
    var origBand = R._battleSafeBand;
    R._battleSafeBand = function (w2, h2, lay) { return origBand(w2, h2, lay, null); };
  }

  function allReady() {
    if (!S.isReady()) return false;
    var set = R.MONSTER_ANIM[mid];
    if (set) {
      for (var k = 0; k < 4; k++) if (!S.getFrame(set.idle, k)) return false;
    }
    return true;
  }

  function boot() {
    try {
      M.init({ menu: false });
      Map.setFloor(f);
      P.floor = f; P.level = 5; P.exp = 24; P.gold = 268;
      P.maxHp = 140; P.hp = 140; P.maxMp = 30; P.mp = 30;
      P.atk = 14; P.def = 6;
      Fx._setClock(function () { return 0; });
      Fx._reset(); PT.clear(); Fb._clear();
      B.start(mid);
      M.switchScene('battle');
      R.resize();
      if (typeof R._setBattleLayout === 'function') R._setBattleLayout(layout);
      R.resize();
      R._animNow = function () { return 1234; };
      B._setClock(function () { return 0; });
      J._setClock(0);
      J._reset();
      if (Game.hud && Game.hud.update) {
        Game.hud.update({
          hp: P.hp, hpMax: P.maxHp, mp: P.mp, mpMax: P.maxMp, gold: P.gold,
          floor: P.floor, level: P.level, exp: P.exp, expNext: 60 * P.level, status: []
        });
      }
      if (dying) {
        var st = B.getState();
        st.dying = true;
        st.dyingAt = performance.now() - 120;
        st.dyingMs = 700;
      }
      if (chipN > 0) {
        var st2 = B.getState();
        st2.defending = chipN >= 2;
        st2.defendRound = (chipN >= 2) ? st2.roundNo : 0;
        st2.shieldValue = 8;
        Game.Systems.Status.clearAll();
        if (chipN >= 3) Game.Systems.Status.apply('poison', 3);
        if (chipN >= 4) Game.Systems.Status.apply('bleed', 2);
      }
      if (wantCard) {
        J.levelUp({ from: 4, to: 5, atkFrom: 14, atkTo: 16, defFrom: 6, defTo: 7, hpFrom: 140, hpTo: 150 });
      }
      if (wantFx) {
        var ct = B._contact('monster');
        Fx.hit({ who: 'monster', dir: -1,
          slash: { x: ct.x, y: ct.y, r: 34, a0: layout === 'horizontal' ? (Math.PI / 2 - 0.5) : -0.15, color: '#ffffff' } });
        Fb.spawn({ kind: 'hit', who: 'monster', x: ct.x - 16, y: ct.y - 23, w: 32, h: 46, life: 110, alpha: 0.6 });
      }
      R.drawBattle(B.getState());
      var bb = R._lastBattleBox;
      var lay = J._layout(R.cssW, R.cssH);
      window.__D109 = {
        asked: layout, layout: bb.layout, W: bb.W, H: bb.H,
        scale: R.scale, dpr: R.dpr, k: R.dpr * R.scale,
        old: wantOld, dying: !!dying, chips: chipN, fx: wantFx,
        band: [lay.top, lay.bottom],
        cards: lay.cards.map(function (c) { return { x: c.x, y: c.y, w: c.w, h: c.h, title: c.card.title }; }),
        obs: ['pipeline', 'log', 'stat', 'player', 'monster'].reduce(function (o, k) {
          if (bb[k]) o[k] = { x: bb[k].x, y: bb[k].y, w: bb[k].w, h: bb[k].h };
          return o;
        }, {}),
        bar: bb.commandBar ? { x: bb.commandBar.x, y: bb.commandBar.y, w: bb.commandBar.w, h: bb.commandBar.h } : null,
        chips: (bb.cards && bb.cards.player && bb.cards.player.chips) || []
      };
      sceneReady = true;
      window.__d109Booted = true;
    } catch (e) {
      document.getElementById('err').textContent = String(e && (e.stack || e.message) || e);
      document.title = 'ERR ' + e;
    }
  }

  S.load();
  (function frame() {
    try {
      if (!window.__d109Booted && allReady()) boot();
      if (sceneReady) {
        R.drawBattle(B.getState());
        try { J.draw(); } catch (e) { /* 降级 */ }
        drawn++;
        if (drawn === 3) {
          document.title = 'READY D109';
          sceneReady = 'done';
        }
      }
    } catch (e) { /* 降级 */ }
    window.requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
