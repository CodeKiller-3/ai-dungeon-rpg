<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>perf_d16</title>
</head>
<body>
<canvas id="game"></canvas>
<!-- D-16 一次性压测采样页（不进 run-all：文件名不是 verify_*）。
     方法沿用 D-12：CDP 真实时钟 + 同步 rAF 驱动 + getImageData(1×1) 强制光栅化，
     只在本页内部插桩（包装 prototype / 函数计时），不改 js/。
     本页专测"战斗场景 + 特效"：off / low / high 三档各 400 帧，玩家每 12 帧出手一次（≈200ms）。 -->
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>
<script src="../js/core/eventBus.js"></script>
<script src="../js/core/sprites.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/render.js"></script>
<script src="../js/data/maps.js"></script>
<script src="../js/data/monsters.js"></script>
<script src="../js/data/items.js"></script>
<script src="../js/data/quests.js"></script>
<script src="../js/data/skills.js"></script>
<script src="../js/data/dialogue.js"></script>
<script src="../js/data/reactions.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/vendor/astar.js"></script>
<script src="../js/vendor/howler.min.js"></script>
<script src="../js/vendor/rot.min.js"></script>
<script src="../js/systems/map.js"></script>
<script src="../js/systems/fov.js"></script>
<script src="../js/systems/hud.js"></script>
<script src="../js/systems/modal.js"></script>
<script src="../js/systems/feedback.js"></script>
<script src="../js/systems/notice.js"></script>
<script src="../js/systems/lighting.js"></script>
<script src="../js/systems/motion.js"></script>
<script src="../js/systems/particles.js"></script>
<script src="../js/systems/fx.js"></script>
<script src="../js/systems/quest.js"></script>
<script src="../js/systems/skills.js"></script>
<script src="../js/systems/bestiary.js"></script>
<script src="../js/systems/battle.js"></script>
<script src="../js/systems/inventory.js"></script>
<script src="../js/systems/shop.js"></script>
<script src="../js/systems/save.js"></script>
<script src="../js/systems/leaderboard.js"></script>
<script src="../js/systems/ai.js"></script>
<script src="../js/systems/npc.js"></script>
<script src="../js/systems/audio.js"></script>
<script src="../js/systems/learner.js"></script>
<script src="../js/core/main.js"></script>
<script>
(function () {
  'use strict';
  var G = window.Game;
  var M = G.Core.Main;
  var P = G.Data.Player;
  var R = { ok: false, phase: 'boot' };

  function mulberry32(a) {
    return function () {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      var t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }

  /* ── 绘制调用计数（只包装 prototype） ── */
  var C = { drawImage: 0, fillRect: 0, fillText: 0 };
  var Proto = CanvasRenderingContext2D.prototype;
  var _di = Proto.drawImage, _fr = Proto.fillRect, _ft = Proto.fillText;
  Proto.drawImage = function () { C.drawImage++; return _di.apply(this, arguments); };
  Proto.fillRect = function () { C.fillRect++; return _fr.apply(this, arguments); };
  Proto.fillText = function () { C.fillText++; return _ft.apply(this, arguments); };

  /* ── 分阶段计时 ── */
  var T = { drawBattle: 0, drawHUD: 0, fxUpdate: 0 };
  function wrap(obj, name, key) {
    var f = obj && obj[name];
    if (typeof f !== 'function') return;
    obj[name] = function () {
      var t0 = performance.now();
      try { return f.apply(this, arguments); }
      finally { T[key] += performance.now() - t0; }
    };
  }
  wrap(G.Core.Render, 'drawBattle', 'drawBattle');
  wrap(G.Core.Render, 'drawHUD', 'drawHUD');
  wrap(G.Fx, 'update', 'fxUpdate');

  function pct(arr, p) {
    if (!arr.length) return null;
    var a = arr.slice().sort(function (x, y) { return x - y; });
    var i = Math.min(a.length - 1, Math.max(0, Math.ceil(p / 100 * a.length) - 1));
    return Math.round(a[i] * 100) / 100;
  }
  function stat(arr) {
    if (!arr.length) return { p50: null, p95: null, max: null, mean: null, n: 0 };
    var s = 0;
    for (var i = 0; i < arr.length; i++) s += arr[i];
    return {
      p50: pct(arr, 50), p95: pct(arr, 95),
      max: Math.round(Math.max.apply(null, arr) * 100) / 100,
      mean: Math.round(s / arr.length * 100) / 100, n: arr.length
    };
  }

  function down(code) {
    window.dispatchEvent(new KeyboardEvent('keydown', { code: code, key: code, bubbles: true }));
  }
  function up(code) {
    window.dispatchEvent(new KeyboardEvent('keyup', { code: code, key: code, bubbles: true }));
  }

  var FRAME_DT = 1000 / 60;
  var ts = 0;
  var SAMPLES = [];

  function sampleFrame(fn) {
    var c0 = { di: C.drawImage, fr: C.fillRect, ft: C.fillText };
    var b0 = T.drawBattle, h0 = T.drawHUD, f0 = T.fxUpdate;
    var w0 = performance.now();
    fn();
    var w1 = performance.now();
    /* 强制光栅化：否则只测到 Canvas2D 入队时间（与 D-12 同口径） */
    var g0 = performance.now();
    try { G.Core.Render._ctx.getImageData(0, 0, 1, 1); } catch (e) { /* 忽略 */ }
    var g1 = performance.now();
    var drawT = (T.drawBattle - b0) + (T.drawHUD - h0);
    SAMPLES.push({
      total: (w1 - w0) + (g1 - g0),
      draw: drawT,
      drawBattle: T.drawBattle - b0,
      fxUpdate: T.fxUpdate - f0,
      update: (w1 - w0) - drawT,
      di: C.drawImage - c0.di,
      fr: C.fillRect - c0.fr,
      ft: C.fillText - c0.ft
    });
  }

  function boot() {
    Math.random = mulberry32(20261216);
    var load = G.Core.Sprites.load;
    G.Core.Sprites.load = function () { return load.call(this, '../assets/sprites/'); };
    M.init();
    window.dispatchEvent(new MouseEvent('click', { bubbles: true }));
    if (M._guideVisible) { M._guideVisible = false; }
    try { G.Systems.Map.getEnemies().length = 0; } catch (e) { /* 忽略 */ }
    try { G.Systems.AI.setPatrols([]); } catch (e) { /* 忽略 */ }
    P.hp = 99999; P.maxHp = 99999; P.mp = 999; P.maxMp = 999;
    /* 战斗时间轴与特效都跟合成帧时钟走，回合与特效才能被稳定推进、样本可复算 */
    G.Systems.Battle._setClock(function () { return ts; });
    G.Fx._setClock(function () { return ts; });
    G.Fx._setPrefersReduced(false);
  }

  function spritesReady() {
    return !!(G.Core.Sprites.isReady() && G.Core.Sprites.get('floor_1') &&
      G.Core.Sprites.get('knight_m_idle_anim_f0') && G.Core.Sprites.get('wall_top_mid'));
  }

  function startBattle() {
    G.Systems.Battle.start('slime');
    var st = G.Systems.Battle.getState();
    if (st) { st.monster.hp = 9000; st.monster.maxHp = 9999; st.monster.atk = 0; }
    M.switchScene('battle');
  }

  /* ── 战斗场景：每 12 帧出手一次（200ms > 输入锁 150ms），全程在战斗中 ── */
  function phaseBattle(n, level) {
    G.Fx.setLevel(level);
    G.Fx._reset();
    startBattle();
    for (var i = 0; i < n; i++) {
      if (M._scene !== 'battle') startBattle();
      if (i % 12 === 0) down('Digit1');
      if (i % 12 === 2) up('Digit1');
      ts += FRAME_DT;
      sampleFrame(function () { M.loop(ts); });
    }
    up('Digit1');
    G.Core.Input.clear();
    return summarize();
  }

  function summarize() {
    var f = SAMPLES;
    function col(k) { return f.map(function (s) { return s[k] || 0; }); }
    var frame = col('total');
    return {
      frames: f.length,
      total: stat(frame),
      draw: stat(col('draw')),
      drawBattle: stat(col('drawBattle')),
      update: stat(col('update')),
      fxUpdate: stat(col('fxUpdate')),
      drawImage: stat(col('di')).p50,
      fillRect: stat(col('fr')).p50,
      fillText: stat(col('ft')).p50,
      over50: frame.filter(function (v) { return v >= 50; }).length
    };
  }

  window.__D16 = {
    run: function () {
      return new Promise(function (resolve, reject) {
        boot();
        var waited = 0;
        (function waitSprites() {
          if (spritesReady()) { start(); return; }
          waited += 100;
          if (waited > 20000) { reject(new Error('sprites not ready')); return; }
          setTimeout(waitSprites, 100);
        })();

        function start() {
          try {
            R.env = {
              dpr: G.Core.Render.dpr, scale: G.Core.Render.scale,
              cssW: G.Core.Render.cssW, cssH: G.Core.Render.cssH,
              innerW: window.innerWidth, innerH: window.innerHeight,
              reduced: G.Fx._state().reduced
            };
            R.phase = 'off';
            SAMPLES = [];
            R.off = phaseBattle(400, 'off');
            R.phase = 'low';
            SAMPLES = [];
            R.low = phaseBattle(400, 'low');
            R.phase = 'high';
            SAMPLES = [];
            R.high = phaseBattle(400, 'high');
            /* 预算口径：低/高三档合并（关档更便宜，不构成风险） */
            R.battle = (function () {
              var a = R.low, b = R.high;
              function merge(x, y) {
                return { p50: Math.max(x.p50, y.p50), p95: Math.max(x.p95, y.p95) };
              }
              var m = merge(a.draw, b.draw);
              var mt = merge(a.total, b.total);
              return {
                p50: m.p50, p95: m.p95,
                drawP50: a.draw.p50, drawP95: Math.max(a.draw.p95, b.draw.p95),
                totalP50: a.total.p50, totalP95: Math.max(a.total.p95, b.total.p95),
                drawImage: Math.max(a.drawImage, b.drawImage),
                fillText: Math.max(a.fillText, b.fillText),
                samples: a.frames + b.frames,
                framesLow: a.frames, framesHigh: b.frames,
                over50: a.over50 + b.over50
              };
            })();
            R.ok = true;
          } catch (e) {
            R.error = String((e && e.stack) || e);
          }
          R.phase = 'done';
          resolve(R);
        }
      });
    }
  };
})();
</script>
</body>
</html>
