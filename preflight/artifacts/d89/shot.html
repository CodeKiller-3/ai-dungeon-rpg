<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>D-89 实拍台</title>
<style>html,body{margin:0;background:#05050a;overflow:hidden}canvas{display:block}
#err{position:fixed;left:0;top:0;color:#f66;font:11px monospace;margin:0;z-index:9}</style>
</head>
<body>
<canvas id="game"></canvas>
<pre id="err"></pre>
<!-- D-89 实拍台：与主游戏同序加载、真实 drawBattle 出图。
     参数：?f=1..5&m=怪物id&mode=none|hit|counter&t=毫秒&w=1024&h=640
     mode=hit     ：玩家出手命中怪物后的第 t 毫秒（t=0 即命中帧）
     mode=counter ：玩家出手后 100ms 怪物反击，取反击后第 t 毫秒
     时钟全部注入固定值，出图可复算；不跑主循环，不让真实时间介入。 -->
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>
<script src="../../../js/core/eventBus.js"></script>
<script src="../../../js/core/sprites.js"></script>
<script src="../../../js/core/input.js"></script>
<script src="../../../js/core/render.js"></script>
<script src="../../../js/data/maps.js"></script>
<script src="../../../js/data/monsters.js"></script>
<script src="../../../js/data/items.js"></script>
<script src="../../../js/data/quests.js"></script>
<script src="../../../js/data/npcs.js"></script>
<script src="../../../js/data/skills.js"></script>
<script src="../../../js/data/dialogue.js"></script>
<script src="../../../js/data/reactions.js"></script>
<script src="../../../js/data/config.js"></script>
<script src="../../../js/vendor/astar.js"></script>
<script src="../../../js/vendor/howler.min.js"></script>
<script src="../../../js/vendor/rot.min.js"></script>
<script src="../../../js/systems/map.js"></script>
<script src="../../../js/systems/fov.js"></script>
<script src="../../../js/systems/hud.js"></script>
<script src="../../../js/systems/feedback.js"></script>
<script src="../../../js/systems/notice.js"></script>
<script src="../../../js/systems/lighting.js"></script>
<script src="../../../js/systems/motion.js"></script>
<script src="../../../js/systems/particles.js"></script>
<script src="../../../js/systems/fx.js"></script>
<script src="../../../js/systems/quest.js"></script>
<script src="../../../js/systems/skills.js"></script>
<script src="../../../js/systems/bestiary.js"></script>
<script src="../../../js/systems/battle.js"></script>
<script src="../../../js/systems/inventory.js"></script>
<script src="../../../js/systems/shop.js"></script>
<script src="../../../js/systems/save.js"></script>
<script src="../../../js/systems/adaptive.js"></script>
<script src="../../../js/systems/leaderboard.js"></script>
<script src="../../../js/systems/ai.js"></script>
<script src="../../../js/systems/npc.js"></script>
<script src="../../../js/systems/audio.js"></script>
<script src="../../../js/systems/learner.js"></script>
<script src="../../../js/systems/juice.js"></script>
<script src="../../../js/core/main.js"></script>
<script>
(function () {
  'use strict';
  var q = {};
  location.search.replace(/^\?/, '').split('&').forEach(function (kv) {
    var p = kv.split('='); if (p[0]) q[decodeURIComponent(p[0])] = decodeURIComponent(p[1] || '');
  });
  var W = +(q.w || 1024), H = +(q.h || 640);
  try {
    Object.defineProperty(window, 'innerWidth', { value: W, configurable: true });
    Object.defineProperty(window, 'innerHeight', { value: H, configurable: true });
  } catch (e) {}
  var M = Game.Core.Main, P = Game.Data.Player, B = Game.Systems.Battle, Map = Game.Systems.Map;
  var R = Game.Core.Render, S = Game.Core.Sprites, Fx = Game.Fx, PT = Game.Particles;

  (function hideHeadlessFps() {
    var proto = window.CanvasRenderingContext2D && window.CanvasRenderingContext2D.prototype;
    if (!proto || proto.__d89fps) return;
    var orig = proto.fillText;
    proto.fillText = function (text, x, y, maxWidth) {
      if (typeof text === 'string' && text.indexOf('FPS=') === 0) {
        text = text.replace(/^FPS=[^|]*\|\s*/, '');
      }
      if (arguments.length > 3) return orig.call(this, text, x, y, maxWidth);
      return orig.call(this, text, x, y);
    };
    proto.__d89fps = true;
  })();

  var spriteLoad = S.load;
  S.load = function () { return spriteLoad.call(this, '../../../assets/sprites/'); };

  var f = Math.max(1, Math.min(5, +(q.f || 1)));
  var mid = q.m || 'slime';
  var T = 0;
  var sceneReady = false;

  function allReady() {
    var i;
    for (i = 1; i <= 8; i++) {
      if (!S.get((f === 1 ? 'floor_' : 't' + f + '_floor_') + i)) return false;
    }
    if (!S.get('knight_m_idle_anim_f0') || !S.get('knight_m_hit_anim_f0')) return false;
    var set = R.MONSTER_ANIM[mid];
    if (set && !S.getFrame(set.idle, 0)) return false;
    return true;
  }

  function boot() {
    try {
      M.init({ menu: false });
      Map.setFloor(f);
      P.floor = f;
      P.level = 5;
      P.exp = 24;
      P.gold = 268;
      P.hp = 100;
      P.maxHp = 140;
      P.mp = 30;
      P.maxMp = 30;
      P.atk = 14;
      P.def = 6;
      B._setClock(function () { return T; });
      Fx._setClock(function () { return T; });
      Fx._reset();
      PT.clear();
      B.start(mid);
      M.switchScene('battle');
      R.resize();
      if (Game.hud && Game.hud.update) {
        Game.hud.update({
          hp: P.hp, hpMax: P.maxHp, mp: P.mp, mpMax: P.maxMp, gold: P.gold,
          floor: P.floor, level: P.level, exp: P.exp, expNext: 60 * P.level, status: []
        });
      }
      R._animNow = function () { return 1234; };
      var mode = q.mode || 'none';
      var t = +(q.t || 0);
      if (mode === 'hit') {
        T = 0;
        B.playerAction('attack');
        T = t;
      } else if (mode === 'counter') {
        T = 0;
        B.playerAction('attack');
        T = 100;
        B.tick(100);
        T = 100 + t;
      }
      /* 粒子按固定步长推进 t 毫秒（不读真实时间），保证同一帧可复算 */
      for (var k = 0; k < Math.floor(t / 16); k++) PT.update(16);
      sceneReady = true;
      window.__d89Booted = true;
    } catch (e) {
      document.getElementById('err').textContent = String(e && (e.stack || e.message) || e);
      document.title = 'ERR ' + e;
    }
  }

  S.load();
  (function frame() {
    try {
      if (!window.__d89Booted && allReady()) boot();
      if (sceneReady) {
        R.drawBattle(B.getState());
        window.__d89Ready = true;
        document.title = 'READY F' + f;
      }
    } catch (e) { /* 降级 */ }
    window.requestAnimationFrame(frame);
  })();
})();
</script>
</body>
</html>
