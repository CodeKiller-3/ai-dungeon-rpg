<!-- D-114 实拍页：真实主循环 + 顶栏/读数带/系统页。
     ?tab=0..3 = 系统页（任务/怪物/物品/系统）；无参数 = 探索画面。 -->
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>

<script src="../../../js/systems/adaptive.js"></script>
<script src="../../../js/systems/leaderboard.js"></script>

<script>
(function () {
  'use strict';
  var q = location.search.match(/[?&]tab=(\d)/);
  var tab = q ? (+q[1]) : -1;
  function boot() {
    try {
      var M = Game.Core.Main, R = Game.Core.Render, P = Game.Data.Player;
      M.init({ menu: false });
      R.resize();
      M._guideVisible = false;
      M._guidePending = false;
      P.hp = 100; P.maxHp = 100; P.mp = 30; P.maxMp = 30; P.gold = 128;
      P.level = 4; P.exp = 24; P.atk = 12; P.def = 6; P.floor = 1;
      P.equipment.weapon = 'elite_fang_5';
      M.start();
      if (tab >= 0) {
        Game.Modal.open('quests');
        Game.Modal._setPage(tab);
      }
      window.__D114 = { tab: tab, cssW: R.cssW, cssH: R.cssH };
      document.title = 'READY D114';
    } catch (e) {
      document.title = 'ERR D114 ' + (e && (e.stack || e.message));
    }
  }
  var S = Game.Core.Sprites;
  var orig = S.load;
  S.load = function () { return orig.call(this, '../../../assets/sprites/'); };
  S.load();
  var tries = 0;
  (function wait() {
    tries++;
    if (S.isReady && S.isReady()) { boot(); return; }
    if (tries > 240) { boot(); return; }
    window.setTimeout(wait, 50);
  })();
})();
</script>
</body>
</html>
