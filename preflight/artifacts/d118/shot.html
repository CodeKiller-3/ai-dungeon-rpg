<!-- D-118 实拍页：窄档读数带（带 ATK）与系统页档案完整词。
     ?mode=explore|sys  ?floor=1..5 -->

<script>
(function () {
  'use strict';
  function qs(k, d) {
    var m = location.search.match(new RegExp('[?&]' + k + '=([^&]+)'));
    return m ? decodeURIComponent(m[1]) : d;
  }
  var mode = qs('mode', 'explore'), floor = +qs('floor', 1);

  function boot() {
    try {
      var M = Game.Core.Main, R = Game.Core.Render, P = Game.Data.Player,
        Map = Game.Systems.Map;
      M.init({ menu: false });
      M._guideVisible = false;
      M._guidePending = false;
      if (Game.Systems.AI && Game.Systems.AI.tick) Game.Systems.AI.tick = function () { };
      if (Game.Systems.Battle && Game.Systems.Battle.tick) Game.Systems.Battle.tick = function () { };
      var seed = 20261119 + floor * 7919, orig = Math.random;
      Math.random = function () { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; };
      try { Map.generate(); Map.setFloor(floor); } finally { Math.random = orig; }
      var g = Map.getGrid();
      function walk(x, y) { return g[y] && g[y][x] !== undefined && g[y][x] !== 0; }
      var cx = Math.floor(g[0].length / 2), cy = Math.floor(g.length / 2), pos = null;
      for (var rad = 0; rad < 40 && !pos; rad++) {
        for (var dy = -rad; dy <= rad && !pos; dy++) {
          for (var dx = -rad; dx <= rad; dx++) {
            if (Math.abs(dx) !== rad && Math.abs(dy) !== rad) continue;
            if (walk(cx + dx, cy + dy)) { pos = { x: cx + dx, y: cy + dy }; break; }
          }
        }
      }
      if (!pos) pos = Map.getSpawn();
      P.x = pos.x; P.y = pos.y; P.floor = floor;
      P.hp = 78; P.maxHp = 100; P.mp = 24; P.maxMp = 30; P.gold = 128;
      P.level = 4; P.exp = 24; P.atk = 12; P.def = 6;
      Game.hud.update({
        hp: P.hp, hpMax: P.maxHp, mp: P.mp, mpMax: P.maxMp, gold: P.gold,
        floor: P.floor, level: P.level, exp: P.exp,
        expNext: Game.Systems.Battle.expToNext(P.level), status: []
      });
      if (Game.fov && typeof Game.fov.update === 'function') {
        Game.fov.update(P.x, P.y, Game.fov.RADIUS || 5, function (x, y) { return Map.tileAt(x, y) === 0; });
      }
      R.resize();
      M.start();
      if (mode === 'sys') {
        Game.Modal.open('quests');
        Game.Modal._setPage(3);
      }
      window.__D118 = {
        mode: mode, floor: floor, pos: pos, scale: R.scale,
        cssW: R.cssW, cssH: R.cssH,
        band: (Game.hud && Game.hud.last && Game.hud.last.hud) || null
      };
      document.title = 'READY D118';
    } catch (e) {
      document.title = 'ERR D118 ' + (e && (e.stack || e.message));
    }
  }

  var S = Game.Core.Sprites, origLoad = S.load;
  S.load = function () { return origLoad.call(this, '../../../assets/sprites/'); };
  S.load();
  var tries = 0;
  (function wait() {
    tries++;
    if (S.isReady && S.isReady()) { boot(); return; }
    if (tries > 240) { boot(); return; }
    window.setTimeout(wait, 50);
  })();
})();
</script>
</body>
</html>
