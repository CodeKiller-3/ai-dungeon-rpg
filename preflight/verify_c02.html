<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>verify_c02</title>
</head>
<body>
<canvas id="game"></canvas>
<!-- C-02 验证页：加载顺序与主游戏一致（data → systems → main 最后），Map 用测试桩替代。
     断言：新局相位归零 / 归零后首次开张只推进 1 位 / 池长≥4 且合法 / 周期=池长 /
           展示条数不变 / 同次开张稳定且换层可复现 / 无套利 / F4F5 档位一致。 -->
<script src="../js/core/eventBus.js"></script>
<script src="../js/core/sprites.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/render.js"></script>
<script src="../js/data/items.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/systems/inventory.js"></script>
<script src="../js/systems/shop.js"></script>
<script src="../js/systems/modal.js"></script>
<script src="../js/core/main.js"></script>
<script>
(function () {
  'use strict';
  var out = { loaded: false, api: false, ok: false };
  function finish() {
    out.ok = !!(out.loaded && out.api && out.ok);
    var text = (out.ok ? 'PASS ' : 'FAIL ') + JSON.stringify(out);
    document.title = text;
    document.body.appendChild(document.createTextNode(text));
  }

  try {
    var D = Game.Data, I = D.ITEMS;
    var STOCK = D.SHOP_STOCK, POOL = D.SHOP_ROTATION, SCROLLS = D.SHOP_SCROLLS;
    var Shop = Game.Systems.Shop, Main = Game.Core.Main, Modal = Game.Modal;
    out.loaded = !!(I && STOCK && POOL && SCROLLS && Game.Data.Player);
    out.api = !!(Shop && typeof Shop.getStock === 'function' && typeof Shop.refresh === 'function' &&
      typeof Shop.resetPhase === 'function' && Main && typeof Main.restart === 'function' &&
      Modal && typeof Modal.open === 'function');
    if (!out.loaded || !out.api) { finish(); return; }

    /* 测试桩：楼层由本地变量控制；不生成地图、不写存档、不跑音频 */
    var floor = 1;
    Game.Systems.Map = {
      getFloor: function () { return floor; },
      setFloor: function (f) { floor = f; },
      getSpawn: function () { return { x: 1, y: 1 }; },
      tileAt: function () { return 0; }
    };

    var sub = {}, ok = true;
    function ids(st) { return st.map(function (x) { return x.id; }); }
    function poolOf(f) { return POOL[f - 1] || []; }
    function coreOf(f) { return STOCK[f - 1] || []; }

    /* 规格公式（手工复算）：核心常驻 + 轮换窗口 2 位 + 每层 1 张卷轴 */
    function expected(f, t) {
      var core = coreOf(f), pool = poolOf(f), res = [], seen = {};
      var i, id;
      for (i = 0; i < core.length; i++) {
        id = core[i];
        if (seen[id] || !I[id]) continue;
        seen[id] = 1; res.push(id);
      }
      if (pool.length) {
        var start = (f * 3 + t) % pool.length, added = 0;
        for (i = 0; i < pool.length && added < 2; i++) {
          id = pool[(start + i) % pool.length];
          if (seen[id] || !I[id]) continue;
          seen[id] = 1; res.push(id); added++;
        }
      }
      var sc = SCROLLS[f - 1];
      if (sc && !seen[sc] && I[sc]) res.push(sc);
      return res;
    }
    function rotOf(st, f) {
      var fixed = {}, i;
      for (i = 0; i < coreOf(f).length; i++) fixed[coreOf(f)[i]] = 1;
      fixed[SCROLLS[f - 1]] = 1;
      return ids(st).filter(function (id) { return !fixed[id]; });
    }
    function diffCount(a, b) {
      var only = {}, n = 0, i;
      for (i = 0; i < a.length; i++) only[a[i]] = (only[a[i]] || 0) + 1;
      for (i = 0; i < b.length; i++) {
        if (only[b[i]]) only[b[i]]--; else n++;
      }
      var k;
      for (k in only) if (only.hasOwnProperty(k)) n += only[k];
      return n;
    }

    /* C2-1 resetOnRestart：连开 3 次改变相位 → restart → 首次开张回到首相位；两次 restart 一致 */
    floor = 1; Shop.resetPhase();
    var j;
    for (j = 0; j < 3; j++) { Modal.open('shop'); Modal.close(); }
    var phaseBefore = ids(Shop.getStock());
    Main.restart();
    Modal.open('shop');
    var firstAfter1 = ids(Shop.getStock());
    Modal.close();
    Main.restart();
    Modal.open('shop');
    var firstAfter2 = ids(Shop.getStock());
    Modal.close();
    var firstExpected = expected(1, 1);
    sub.c21_resetOnRestart = phaseBefore.join('|') !== firstAfter1.join('|') &&
      firstAfter1.join('|') === firstAfter2.join('|') &&
      firstAfter1.join('|') === firstExpected.join('|');
    sub.c21_before = phaseBefore;
    sub.c21_after = firstAfter1;

    /* C2-2 noDoubleAdvance：restart 只归零不推进；首次 Modal.open 恰好推进 1 位 */
    floor = 1; Main.restart();
    var t0 = ids(Shop.getStock());
    var t0b = ids(Shop.getStock());          /* 读取不推进 */
    Modal.open('shop');
    var t1 = ids(Shop.getStock());
    Modal.close();
    sub.c22_noDoubleAdvance = t0.join('|') === expected(1, 0).join('|') &&
      t0.join('|') === t0b.join('|') &&
      t1.join('|') === expected(1, 1).join('|') &&
      t1.join('|') !== expected(1, 2).join('|');
    sub.c22_rot_t0 = rotOf(Shop.getStock(), 1); /* 记录当前（tick=1）轮换位，供回报对照 */

    /* C2-3 poolSize：各层池长 ≥4；id 存在、行内不重复、price > sell */
    var poolBad = [], lens = [];
    for (var f3 = 1; f3 <= 5; f3++) {
      var row = poolOf(f3), seen3 = {};
      lens.push(row.length);
      if (row.length < 4) poolBad.push('len' + f3);
      for (var i3 = 0; i3 < row.length; i3++) {
        var id3 = row[i3];
        if (!I[id3] || seen3[id3] || !(I[id3].price > I[id3].sell)) poolBad.push(id3);
        seen3[id3] = 1;
      }
    }
    sub.c23_poolSize = poolBad.length === 0 && lens.every(function (n) { return n >= 4; });
    sub.c23_lens = lens;

    /* C2-4 cycleLen：周期 = 池长（≠3），相邻两次至少变化 1 个轮换位 */
    var cycles = [], seqSamples = {}, adjMin = 999;
    for (var f4 = 1; f4 <= 5; f4++) {
      floor = f4; Shop.resetPhase();
      var L = poolOf(f4).length, seq = [], rots = [], idx;
      Shop.getStock();
      for (idx = 0; idx < L + 1; idx++) {
        Shop.refresh();
        var cur = Shop.getStock();
        seq.push(ids(cur).join('|'));
        rots.push(rotOf(cur, f4));
      }
      var period = 0;
      for (var p = 1; p <= L; p++) {
        var same = true;
        for (var q = 0; q + p < seq.length; q++) if (seq[q] !== seq[q + p]) { same = false; break; }
        if (same) { period = p; break; }
      }
      cycles.push(period);
      if (f4 === 1) seqSamples = { seq: seq.slice(0, 6), rots: rots.slice(0, 6) };
      for (idx = 1; idx < rots.length; idx++) {
        var d = diffCount(rots[idx - 1], rots[idx]);
        if (d < adjMin) adjMin = d;
      }
    }
    sub.c24_cycleLen = cycles.length === 5 && cycles.every(function (p2, i4) {
      return p2 === poolOf(i4 + 1).length && p2 !== 3;
    }) && adjMin >= 1;
    sub.c24_cycles = cycles;
    sub.c24_adjMin = adjMin;
    sub.c24_sample_f1 = seqSamples;

    /* C2-5 countsUnchanged：核心 7/9/9/8/8；合计 10/12/12/11/11 且 ≤ 12 */
    var coreCounts = STOCK.map(function (r) { return r.length; });
    var totals = [], overlap = [];
    for (var f5 = 1; f5 <= 5; f5++) {
      floor = f5; Shop.resetPhase();
      totals.push(Shop.getStock().length);
      poolOf(f5).forEach(function (pid) {
        if (coreOf(f5).indexOf(pid) >= 0 || pid === SCROLLS[f5 - 1]) overlap.push(f5 + ':' + pid);
      });
    }
    sub.c25_countsUnchanged = coreCounts.join(',') === '7,9,9,8,8' &&
      totals.join(',') === '10,12,12,11,11' &&
      Math.max.apply(null, totals) <= 12 && overlap.length === 0;
    sub.c25_core = coreCounts;
    sub.c25_totals = totals;

    /* C2-6 stableWithinOpen：同层同一次开张多次读取一致；换层归零后回访可复现 */
    floor = 3; Shop.resetPhase();
    var s1 = ids(Shop.getStock());
    var s2 = ids(Shop.getStock());
    var f3first = s1.join('|');
    floor = 1; Shop.getStock();
    floor = 3;
    var back = ids(Shop.getStock());
    sub.c26_stableWithinOpen = s1.join('|') === s2.join('|') && back.join('|') === f3first;
    sub.c26_sample = s1;

    /* C2-7 noArbitrage：全物品 price > sell；plate_armor_epic 实买实卖 −800 / +400 */
    var arbBad = [];
    Object.keys(I).forEach(function (k) { if (!(I[k].price > I[k].sell)) arbBad.push(k); });
    var P = Game.Data.Player;
    P.gold = 100000;
    P.inventory = {};
    P.equipment = { weapon: null, armor: null };
    var g0 = P.gold;
    var rb = Shop.buy('plate_armor_epic');
    var g1 = P.gold;
    var rs = Shop.sell('plate_armor_epic');
    var g2 = P.gold;
    sub.c27_noArbitrage = arbBad.length === 0 && rb.ok && rs.ok &&
      (g1 - g0) === -800 && (g2 - g1) === 400 && (g2 - g0) < 0;
    sub.c27_delta = { buy: g1 - g0, sell: g2 - g1, net: g2 - g0 };

    /* C2-8 tierCoherence：F4/F5 轮换池每项为装备类且 price ≥ 该层核心装备最低价 */
    var tier = {};
    for (var f8 = 4; f8 <= 5; f8++) {
      var eqMin = Infinity;
      coreOf(f8).forEach(function (cid) {
        var ci = I[cid];
        if (ci && ci.type !== 'consumable' && ci.price < eqMin) eqMin = ci.price;
      });
      var badTier = [];
      poolOf(f8).forEach(function (pid2) {
        var pi = I[pid2];
        if (!pi || pi.type === 'consumable' || pi.price < eqMin) badTier.push(pid2);
      });
      tier['f' + f8] = { coreEquipMin: eqMin, bad: badTier };
      if (badTier.length) ok = false;
    }
    sub.c28_tierCoherence = (tier.f4.bad.length === 0 && tier.f5.bad.length === 0);
    sub.c28_detail = tier;
    ok = ok && sub.c21_resetOnRestart && sub.c22_noDoubleAdvance && sub.c23_poolSize &&
      sub.c24_cycleLen && sub.c25_countsUnchanged && sub.c26_stableWithinOpen &&
      sub.c27_noArbitrage && sub.c28_tierCoherence;

    out.sub = sub;
    out.ok = ok;
  } catch (e) {
    out.err = String(e && e.stack || e);
    out.ok = false;
  }
  finish();
})();
</script>
</body>
</html>
