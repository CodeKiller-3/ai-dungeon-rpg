<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>D-47 实体 NPC 与任务闭环</title>
<style>
  body { background:#111; color:#ddd; font:13px/1.5 Consolas,monospace; margin:12px; }
  h1 { font-size:15px; color:#7fd1ff; margin:0 0 8px; }
  pre { white-space:pre-wrap; word-break:break-all; }
  canvas { position:fixed; left:-9999px; top:0; }
</style>
</head>
<body>
<h1>D-47 · B1（默认）/ B1+NPC / G2 / S1 / M1 同种子 1001–1050（只产出 d47-*.json）</h1>
<pre id="report">RUNNING</pre>
<canvas id="game" width="1024" height="640"></canvas>
<script>window.__AI_DUNGEON_NO_AUTOSTART__ = true;</script>

<script src="../js/core/eventBus.js"></script>
<script src="../js/core/sprites.js"></script>
<script src="../js/core/input.js"></script>
<script src="../js/core/render.js"></script>
<script src="../js/data/maps.js"></script>
<script src="../js/data/monsters.js"></script>
<script src="../js/data/items.js"></script>
<script src="../js/data/quests.js"></script>
<script src="../js/data/npcs.js"></script>
<script src="../js/data/skills.js"></script>
<script src="../js/data/dialogue.js"></script>
<script src="../js/data/reactions.js"></script>
<script src="../js/data/config.js"></script>
<script src="../js/vendor/astar.js"></script>
<script src="../js/vendor/howler.min.js"></script>
<script src="../js/vendor/rot.min.js"></script>
<script src="../js/systems/map.js"></script>
<script src="../js/systems/fov.js"></script>
<script src="../js/systems/hud.js"></script>
<script src="../js/systems/modal.js"></script>
<script src="../js/systems/feedback.js"></script>
<script src="../js/systems/notice.js"></script>
<script src="../js/systems/lighting.js"></script>
<script src="../js/systems/motion.js"></script>
<script src="../js/systems/particles.js"></script>
<script src="../js/systems/fx.js"></script>
<script src="../js/systems/quest.js"></script>
<script src="../js/systems/skills.js"></script>
<script src="../js/systems/bestiary.js"></script>
<script src="../js/systems/battle.js"></script>
<script src="../js/systems/inventory.js"></script>
<script src="../js/systems/shop.js"></script>
<script src="../js/systems/save.js"></script>
<script src="../js/systems/leaderboard.js"></script>
<script src="../js/systems/ai.js"></script>
<script src="../js/systems/npc.js"></script>
<script src="../js/systems/audio.js"></script>
<script src="../js/systems/learner.js"></script>
<script src="../js/core/main.js"></script>
<script src="lib/d17_bot.js"></script>
<script>
/* D-47 跑局器（只测量，不改任何 判据）：
 *   ?mode=main（默认）  B1 默认 50 种子 + B1+NPC 50 种子 + G2/S1/M1 同种子对照
 *   ?only=b1|b1n|g2|s1|m1&n=50  只跑一支（调参用）
 * 种子 1001–1050、maxActions 2500，与 D-37..D-46 完全一致。
 * B1 默认支路不传 opts.npc，逐局结果必须与 d46-after.json 完全一致（不退化守门）。 */
(function () {
  'use strict';
  var out = {
    protocol: 'D-47', mode: 'main', env: {}, summary: {}, runs: {}, agg: {},
    b1: {}, b1n: {}, npcAgg: {}, d46: null, ok: false
  };
  function seedsOf(n) { var a = []; for (var i = 1001; i < 1001 + n; i++) a.push(i); return a; }

  function aggBase(runs) {
    var d = {
      outcomes: { win: 0, dead: 0, stuck: 0 }, deathFloor: {},
      floorReach: {}, killsTotal: 0
    };
    for (var i = 0; i < runs.length; i++) {
      var r = runs[i];
      if (r.outcome === 'win') d.outcomes.win++;
      else if (r.outcome === 'dead') d.outcomes.dead++;
      else d.outcomes.stuck++;
      if (r.outcome !== 'win') d.deathFloor[r.deathFloor || r.floor] = (d.deathFloor[r.deathFloor || r.floor] || 0) + 1;
      d.killsTotal += r.kills || 0;
      var reached = {}, hitF5 = (r.floor === 5);
      var ends = r.b1 ? (r.b1.floorExit || []) : (r.floors || []);
      for (var f = 0; f < ends.length; f++) {
        reached[ends[f].floor] = 1;
        if (ends[f].floor === 5) hitF5 = true;
      }
      if (r.b1) {
        for (var en = 0; en < (r.b1.floorEnter || []).length; en++) {
          reached[r.b1.floorEnter[en].floor] = 1;
          if (r.b1.floorEnter[en].floor === 5) hitF5 = true;
        }
      }
      for (var k in reached) d.floorReach[k] = (d.floorReach[k] || 0) + 1;
      d.f5 = d.f5 || { reached: 0 };
      if (hitF5) d.f5.reached++;
    }
    return d;
  }

  /* NPC 支路汇总（接取/交付/失败/状态分布/绕行步数） */
  function aggNpc(runs) {
    var a = {
      runs: runs.length, accepted: 0, delivered: 0, fails: 0, talks: 0,
      states: { unaccepted: 0, active: 0, ready: 0, done: 0 },
      goldTotal: 0, detourSteps: 0, withNpc: 0,
      acceptedSeeds: [], deliveredSeeds: []
    };
    for (var i = 0; i < runs.length; i++) {
      var r = runs[i], n = r.npc;
      if (!n) continue;
      a.withNpc++;
      if (n.accepted) { a.accepted++; a.acceptedSeeds.push(r.seed); }
      if (n.delivered) { a.delivered++; a.deliveredSeeds.push(r.seed); }
      a.fails += n.fails || 0;
      a.talks += n.talks || 0;
      a.goldTotal += n.gold || 0;
      a.detourSteps += n.detourSteps || 0;
      a.states[n.stateAtEnd || 'unaccepted'] = (a.states[n.stateAtEnd || 'unaccepted'] || 0) + 1;
    }
    return a;
  }

  function trimRun(r) {
    return {
      seed: r.seed, outcome: r.outcome, deathFloor: r.deathFloor || r.floor, floor: r.floor,
      hp: r.hp, level: r.level, gold: r.gold, equip: r.equip, kills: r.kills,
      battles: r.battles, actions: r.actions, simSec: r.simSec,
      shopVisits: r.shopVisits, shopBuys: r.shopBuys, shopSpent: r.shopSpent,
      potions: r.potions, npc: r.npc || null, d46: r.d46 || null,
      enterF5: (r.b1 && r.b1.enterF5) ? {
        potions: r.b1.enterF5.potions, hp: r.b1.enterF5.hp, gold: r.b1.enterF5.gold
      } : null
    };
  }

  try {
    var M = Game.Core.Main;
    M.init();
    M.closeGuide();
    var qs = location.search || '';
    var mn = /n=(\d+)/.exec(qs), mo = /only=(b1n|b1|g2|s1|m1)/.exec(qs);
    var n = mn ? Math.max(1, Math.min(200, +mn[1])) : 50;
    out.env.maxActions = 2500;
    out.env.seeds = seedsOf(n);
    out.env.npcs = JSON.parse(JSON.stringify(Game.Data.NPCS));

    var B1OPTS = { maxActions: 2500, b1: { reserve: 4 }, d42: true, d45: true, d46: true };
    var B1N = { maxActions: 2500, b1: { reserve: 4 }, d42: true, d45: true, d46: true, npc: true };
    function optsFor(key) {
      if (key === 'b1') return B1OPTS;
      if (key === 'b1n') return B1N;
      if (key === 'g2') return { maxActions: 2500, d37: { fireball: true, flee: true }, d42: true };
      if (key === 's1') return { maxActions: 2500, d39: { avoid: true }, d42: true };
      return { maxActions: 2500, m1: { clear: true }, d42: true };
    }
    var plan = mo ? [mo[1]] : ['b1', 'b1n', 'g2', 's1', 'm1'];
    var t0 = Date.now();
    for (var p = 0; p < plan.length; p++) {
      var key = plan[p], res = Game.Bot.batch(out.env.seeds, optsFor(key));
      out.runs[key] = res.runs.map(trimRun);
      out.summary[key] = res.summary;
      out.agg[key] = aggBase(res.runs);
      if (key === 'b1') out.b1 = { wins: out.agg.b1.outcomes.win, f5: out.agg.b1.f5.reached };
      if (key === 'b1n') out.npcAgg = aggNpc(res.runs);
    }
    /* b1n 的金币账（D 组：任务金币恒为 60、单局任务总额 ≤150） */
    var questGold = [];
    if (out.runs.b1n) {
      for (var q = 0; q < out.runs.b1n.length; q++) {
        var rr = out.runs.b1n[q];
        if (!rr.d46) continue;
        questGold.push({ seed: rr.seed, quest: rr.d46.income.quest, npcGold: rr.npc ? rr.npc.gold : null,
          delivered: !!(rr.npc && rr.npc.delivered) });
      }
    }
    out.d47 = { questGold: questGold };
    out.wallMs = Date.now() - t0;
    out.ok = true;
    document.title = 'BATCH_DONE n=' + n +
      ' b1_win=' + out.agg.b1.outcomes.win + '/50' +
      ' b1_f5=' + out.agg.b1.f5.reached +
      ' b1n_win=' + (out.agg.b1n ? out.agg.b1n.outcomes.win : '-') +
      ' accepted=' + out.npcAgg.accepted +
      ' delivered=' + out.npcAgg.delivered +
      ' m1_f4=' + (out.agg.m1 ? out.agg.m1.floorReach['4'] : '-') +
      ' wallMs=' + out.wallMs;
  } catch (e) {
    out.err = String((e && (e.message + '\n' + (e.orig || e.stack))) || e);
    document.title = 'BATCH_FAIL';
  }
  window.__D47__ = out;
  document.getElementById('report').textContent = JSON.stringify(out);
})();
</script>
</body>
</html>
